/* Marques tierces : logo officiel si son fichier a été déposé dans BRAND_ASSETS (00-config.js), sinon pictogramme neutre
   (jamais l'initiale seule) ; le nom complet du service est toujours écrit à côté. */
const BRAND_GLYPH={apple:'<rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/>',google:'<circle cx="11" cy="11" r="6"/><path d="M15.5 15.5L20 20"/>',instagram:'<rect x="4" y="6" width="16" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',tiktok:'<path d="M9 18a3 3 0 1 1 0-6M9 18V5l8 2"/>',facebook:'<circle cx="9" cy="9" r="3"/><circle cx="16" cy="10" r="2.5"/><path d="M3 19c.6-3 3-5 6-5s5.4 2 6 5M14 15.5c2.6 0 4.4 1.4 5 3.5"/>',youtube:'<rect x="3" y="6" width="18" height="12" rx="3"/><path d="M10 9.5v5l4.5-2.5z"/>',appstore:'<path d="M6 8h12l-1 12H7zM9 8V6a3 3 0 0 1 6 0v2"/>'};
function brandMark(k){const a=BRAND_ASSETS[k];if(a)return `<img class="brand-mark" src="${esc(a)}" alt="" width="22" height="22">`;const g=BRAND_GLYPH[k];
  return g?`<span class="brand-mark" aria-hidden="true">${svg(g)}</span>`:`<span class="brand-mark" aria-hidden="true">${svg('<circle cx="12" cy="12" r="7"/>')}</span>`}
/* Questions */
function authQuestion(){
  const st=OB_STEPS[draft().step],a=ans(),v=a[st.k]||{};
  let body="",cont=true;
  if(st.type==="goals"){const sel=v.v||[];body=`<div class="ob-grid">${OB_GOALS.map(([k,l],i)=>`<button class="ob-card ${sel.includes(k)?"on":""}" data-obm="goals:${k}" aria-pressed="${sel.includes(k)}"><span class="ob-ic c${i%4}" aria-hidden="true">${goalIcon(k)}</span><span>${l}</span></button>`).join("")}</div>
    ${sel.includes("autre")?`<div class="field"><label for="obOther_goals">Précise ton objectif</label><input id="obOther_goals" value="${esc(v.other||"")}" data-obother="goals"></div>`:""}
    ${sel.length>1?`<div class="field"><span class="lbl" id="mainL">Objectif principal</span><div class="toggles" role="radiogroup" aria-labelledby="mainL">${sel.map(k=>`<button class="toggle" role="radio" aria-checked="${v.main===k}" aria-pressed="${v.main===k}" data-obmain="${k}">${optLabel(OB_GOALS,k)}</button>`).join("")}</div></div>`:""}`}
  else if(st.type==="multi"){const sel=v.v||[];body=`<div class="ob-list">${st.opts.map(([k,l])=>`<button class="ob-opt ${sel.includes(k)?"on":""}" data-obm="${st.k}:${k}" aria-pressed="${sel.includes(k)}"><span>${l}</span><span class="ob-check" aria-hidden="true">${sel.includes(k)?ICONS.check:""}</span></button>`).join("")}</div>${sel.includes("autre")?`<div class="field"><label for="obOther_${st.k}">Précise</label><input id="obOther_${st.k}" value="${esc(v.other||"")}" data-obother="${st.k}"></div>`:""}`}
  else if(st.type==="single"){cont=st.k==="source"?false:false;body=`<div class="ob-list" role="radiogroup" aria-label="${esc(st.q)}">${st.opts.map(([k,l])=>`<button class="ob-opt ${v.v===k?"on":""}" role="radio" aria-checked="${v.v===k}" data-obs="${st.k}:${k}"><span>${st.k==="source"?brandMark(k):""}${l}</span></button>`).join("")}</div>${v.v==="autre"?`<div class="field"><label for="obOther_${st.k}">Précise</label><input id="obOther_${st.k}" value="${esc(v.other||"")}" data-obother="${st.k}"></div>`:""}`;cont=v.v==="autre"}
  else if(st.type==="levels"){body=sportsSel(a).map(sp=>`<div class="field"><span class="lbl" id="lv_${sp}">${esc(sp==="autre"?((a.sports||{}).other||"Autre sport"):optLabel(OB_SPORTS,sp))}</span><div class="toggles" role="radiogroup" aria-labelledby="lv_${sp}">${OB_LEVELS.map(([k,l])=>`<button class="toggle" role="radio" aria-checked="${(v.v||{})[sp]===k}" aria-pressed="${(v.v||{})[sp]===k}" data-oblv="${sp}:${k}">${l}</button>`).join("")}</div></div>`).join("")}
  else if(st.type==="freq"){body=sportsSel(a).map(sp=>{const n=(v.v||{})[sp]??"";return `<div class="stepper-row"><span>${esc(sp==="autre"?((a.sports||{}).other||"Autre sport"):optLabel(OB_SPORTS,sp))}</span><div class="stepper"><button class="icon-btn" data-obfq="${sp}:-1" aria-label="Moins">−</button><b class="num" aria-live="polite">${n===""?"–":n}</b><button class="icon-btn" data-obfq="${sp}:1" aria-label="Plus">+</button></div><span class="small muted">/ semaine</span></div>`}).join("")}
  else if(st.type==="exp"){cont=false;body=`<div class="ob-list" role="radiogroup" aria-label="Expérience">${OB_EXP.map(([k,l,g])=>`<button class="ob-opt exp ${v.v===k?"on":""}" role="radio" aria-checked="${v.v===k}" data-obs="exp:${k}"><span>${l}</span><span class="gauge" aria-hidden="true">${[1,2,3,4,5,6].map(x=>`<i class="${x<=g?"on":""}"></i>`).join("")}</span></button>`).join("")}</div>`}
  else if(st.type==="dispo"){const days=v.days||[];body=`<div class="field"><span class="lbl">Jours disponibles</span><div class="toggles">${OB_DAYS.map(([k,l])=>`<button class="toggle" aria-pressed="${days.includes(k)}" data-obday="${k}">${l}</button>`).join("")}</div></div>
    <div class="field"><span class="lbl" id="durL">Durée préférée d'une séance</span><div class="toggles" role="radiogroup" aria-labelledby="durL">${["30","45","60","75","90"].map(m=>`<button class="toggle" role="radio" aria-checked="${v.dur===m}" aria-pressed="${v.dur===m}" data-obdur="${m}">${m} min</button>`).join("")}</div></div>`}
  else if(st.type==="equip"){const cat=v.cat;body=`<div class="ob-list" role="radiogroup" aria-label="Catégorie">${[["salle","Salle de sport"],["domicile","Matériel à domicile"],["aucun","Aucun matériel"]].map(([k,l])=>`<button class="ob-opt ${cat===k?"on":""}" role="radio" aria-checked="${cat===k}" data-obeqcat="${k}"><span>${l}</span></button>`).join("")}</div>
    ${cat&&OB_EQUIP[cat].length?`<div class="field"><span class="lbl">Précise ton matériel</span><div class="toggles">${OB_EQUIP[cat].map(x=>`<button class="toggle" aria-pressed="${(v.items||[]).includes(x)}" data-obeq="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>`:""}`}
  else if(st.type==="pain"){const sel=v.v||[];body=`<div class="toggles">${OB_PAIN.map(([k,l])=>`<button class="toggle" aria-pressed="${sel.includes(k)}" data-obm="pain:${k}">${l}</button>`).join("")}</div>
    ${sel.includes("autre")?`<div class="field"><label for="obOther_pain">Précise</label><input id="obOther_pain" value="${esc(v.other||"")}" data-obother="pain"></div>`:""}
    <div class="field"><label for="obPainTxt">Restrictions médicales ou précisions (facultatif)</label><textarea id="obPainTxt" data-obtext="pain">${esc(v.txt||"")}</textarea></div>`}
  else if(st.type==="weight"){const u=v.unit||"kg",w=isNum(v.kg)?+v.kg:70,disp=u==="lb"?w*LB:w;const r10=Math.round(disp*10)/10,ip=Math.floor(r10),dp=Math.round((r10-ip)*10)%10;const [lo,hi]=W_RANGE[u];
    body=`<div class="w-big num" aria-live="polite" id="wBig">${fmt(r10,1)} ${u}</div><p class="small center ${v.confirmed?"":"muted"}" id="wState">${v.confirmed?"Poids confirmé.":"Valeur proposée, pas encore enregistrée : fais défiler, saisis ton poids ou confirme."}</p>
     <div class="wheels" aria-hidden="true"><div class="wheel" id="wInt">${Array.from({length:hi-lo+1},(_,i)=>`<span data-v="${i+lo}" class="${i+lo===ip?"on":""}">${i+lo}</span>`).join("")}</div><b class="w-dot">,</b><div class="wheel" id="wDec">${Array.from({length:10},(_,i)=>`<span data-v="${i}" class="${i===dp?"on":""}">${i}</span>`).join("")}</div>
     <div class="w-unit" role="radiogroup" aria-label="Unité">${["kg","lb"].map(x=>`<button role="radio" aria-checked="${u===x}" data-obunit="${x}">${x}</button>`).join("")}</div></div>
     ${v.confirmed?"":`<button class="btn secondary full" data-act="obConfirmW">Confirmer ${fmt(r10,1)} ${u}</button>`}
     <div class="field"><label for="wKey">Saisir au clavier (${u}, entre ${lo} et ${hi})</label><input id="wKey" type="number" inputmode="decimal" step="0.1" min="${lo}" max="${hi}" value="${v.confirmed?r10:""}" placeholder="${r10}" aria-describedby="wState"></div>
     <div class="grid2">${fld("obHeight","Taille (cm, facultatif)","number",v.height||"","1")}${fld("obBirth","Année de naissance (facultatif)","number",v.birth||"","1")}</div>`}
  else if(st.type==="devices"){const sel=v.v||[];body=`<div class="ob-list">${OB_DEVICES.map(([k,l])=>`<button class="ob-opt ${sel.includes(k)?"on":""}" data-obm="devices:${k}" aria-pressed="${sel.includes(k)}"><span>${l}</span><span class="ob-check" aria-hidden="true">${sel.includes(k)?ICONS.check:""}</span></button>`).join("")}</div>
    ${sel.filter(k=>k!=="aucun"&&k!=="sante").map(k=>`<div class="field"><label for="dv_${k}">${optLabel(OB_DEVICES,k)} : marque et modèle</label><input id="dv_${k}" value="${esc((v.models||{})[k]||"")}" data-obdev="${k}"></div>`).join("")}`}
  else if(st.type==="sportDetail"){const D=a.sportDetail=a.sportDetail||{};body=sportsSel(a).map(sp=>{const v=D[sp]||{};const nm=esc(sp==="autre"?((a.sports||{}).other||"Autre sport"):optLabel(OB_SPORTS,sp));
      return `<section class="card stack tight sd-card"><h3>${nm}${(a.freq&&a.freq.v&&isNum(a.freq.v[sp]))?` <span class="small muted">· ${a.freq.v[sp]} entraînement(s) par semaine</span>`:""}</h3>
       <div class="field"><span class="lbl">Jours habituels</span><div class="toggles">${OB_DAYS.map(([k,l])=>`<button class="toggle" aria-pressed="${(v.days||[]).includes(k)}" data-obsd="${sp}:days:${k}">${l}</button>`).join("")}</div></div>
       <div class="grid2"><div class="field"><label for="sdt_${sp}">Horaire habituel</label><input id="sdt_${sp}" type="time" value="${esc(v.time||"")}" data-obsdt="${sp}"></div>
       <div class="field"><span class="lbl" id="sdd_${sp}">Durée habituelle</span><div class="toggles" role="radiogroup" aria-labelledby="sdd_${sp}">${["60","75","90","120"].map(m=>`<button class="toggle" role="radio" aria-checked="${v.dur===m}" aria-pressed="${v.dur===m}" data-obsd="${sp}:dur:${m}">${m} min</button>`).join("")}</div></div></div>
       <div class="field"><span class="lbl">Jours de match ou de compétition</span><div class="toggles">${OB_DAYS.map(([k,l])=>`<button class="toggle" aria-pressed="${(v.matchDays||[]).includes(k)}" data-obsd="${sp}:matchDays:${k}">${l}</button>`).join("")}</div></div>
       <div class="field"><span class="lbl" id="sdf_${sp}">Calendrier</span><div class="toggles" role="radiogroup" aria-labelledby="sdf_${sp}">${[["1","Fixe"],["0","Variable"]].map(([k,l])=>`<button class="toggle" role="radio" aria-checked="${String(v.fixed===false?0:v.fixed===true?1:"")===k}" aria-pressed="${String(v.fixed===false?0:v.fixed===true?1:"")===k}" data-obsd="${sp}:fixed:${k}">${l}</button>`).join("")}</div></div></section>`}).join("")}
  else if(st.type==="recap"){body=`<div class="stack tight">${OB_STEPS.map((x,i)=>({x,i})).filter(({x})=>!["recap","account"].includes(x.k)&&!(x.skipIf&&x.skipIf(a))).map(({x,i})=>{const t=recapText(x.k,a);
      return `<div class="list-item recap-row" style="cursor:default"><div class="grow"><b class="small">${esc(x.q)}</b><div class="small ${t?"":"muted"}">${t?esc(t):(a[x.k]&&a[x.k].skipped?"Passée":"Non renseignée")}</div></div><button class="btn ghost small" data-obedit="${i}" aria-label="Modifier : ${esc(x.q)}">Modifier</button></div>`}).join("")}</div>`;cont=true}
  else if(st.type==="account")return authAccount();
  const ok=stepValid(st,a);
  return `<div class="ob">${obHead()}<h1>${esc(st.q)}</h1>${st.sub?`<p class="ob-sub">${esc(st.sub)}</p>`:""}<div class="ob-body">${body}</div>

const LB=2.20462;const W_RANGE={kg:[30,250],lb:[66,551]};
/* Le poids n'est enregistré qu'après une action volontaire : défilement par l'utilisateur, saisie, ou « Confirmer ». */
function initWheels(){
  ["wInt","wDec"].forEach(id=>{const w=document.getElementById(id);if(!w)return;const on=w.querySelector(".on");if(on)w.scrollTop=on.offsetTop-w.clientHeight/2+on.clientHeight/2;
    const mark=()=>{w._user=true};["pointerdown","touchstart","wheel","keydown"].forEach(e=>w.addEventListener(e,mark,{passive:true}));
    let tm=null;w.addEventListener("scroll",()=>{if(!w._user)return;clearTimeout(tm);tm=setTimeout(()=>setWheel(true),120)},{passive:true});
    w.addEventListener("click",e=>{const s=e.target.closest("span[data-v]");if(!s)return;w._user=true;s.scrollIntoView({block:"center",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})})});
}
function wheelVal(id){const w=document.getElementById(id);if(!w)return 0;const mid=w.scrollTop+w.clientHeight/2;let best=null,bd=1e9;w.querySelectorAll("span").forEach(s=>{const d=Math.abs(s.offsetTop+s.clientHeight/2-mid);if(d<bd){bd=d;best=s}});w.querySelectorAll("span").forEach(s=>s.classList.toggle("on",s===best));return best?+best.dataset.v:0}

  a.body={...(a.body||{}),kg:Math.round(kg*10)/10,unit:u,confirmed:a.body&&a.body.confirmed||!!confirm};obSave();
  const b=document.getElementById("wBig");if(b)b.textContent=fmt(disp,1)+" "+u;const st=document.getElementById("wState");if(st&&a.body.confirmed){st.textContent="Poids confirmé : "+fmt(disp,1)+" "+u+(u==="lb"?" ("+fmt(a.body.kg,1)+" kg)":"")+".";st.classList.remove("muted")}

function recapText(k,a){const v=a[k];if(!v||v.skipped)return "";const L=(list,x)=>optLabel(list,x);

   case "sports":return (v.v||[]).map(x=>x==="autre"?v.other:L(OB_SPORTS,x)).join(", ");
   case "levels":return Object.entries(v.v||{}).map(([s,l])=>L(OB_SPORTS,s)+" : "+L(OB_LEVELS,l)).join(", ");
   case "freq":return Object.entries(v.v||{}).map(([s,n])=>L(OB_SPORTS,s)+" : "+n+"/sem.").join(", ");
   case "sportDetail":return Object.entries(v).filter(([s,d])=>isObj(d)).map(([s,d])=>L(OB_SPORTS,s)+" : "+((d.days||[]).map(x=>L(OB_DAYS,x)).join(" ")||"jours non précisés")+(d.time?" à "+d.time:"")+(d.dur?", "+d.dur+" min":"")+((d.matchDays||[]).length?", matchs "+d.matchDays.map(x=>L(OB_DAYS,x)).join(" "):"")+(d.fixed===false?", variable":d.fixed===true?", fixe":"")).join(" ; ");
   case "exp":return L(OB_EXP,v.v);case "sex":return L([["femme","Femme"],["homme","Homme"]],v.v);
   case "dispo":return (v.days||[]).map(x=>L(OB_DAYS,x)).join(", ")+(v.dur?" · "+v.dur+" min":"");
   case "equip":return ({salle:"Salle",domicile:"Domicile",aucun:"Aucun matériel"}[v.cat]||"")+((v.items||[]).length?" : "+v.items.join(", "):"");
   case "pain":return (v.v||[]).map(x=>x==="autre"?v.other:L(OB_PAIN,x)).join(", ")+(v.txt?" · "+v.txt:"");
   case "body":return isNum(v.kg)?fmt(v.kg)+" kg"+(v.height?" · "+v.height+" cm":"")+(v.birth?" · "+v.birth:""):"";
   case "devices":return (v.v||[]).map(x=>L(OB_DEVICES,x)).join(", ");case "expect":return (v.v||[]).map(x=>L(OB_EXPECT,x)).join(", ");

function onboardSummary(o){const L=(list,k)=>optLabel(list,k);const out=[];

  return `<form class="card stack" id="caTestForm" data-uid="${a.id}"><h3>Saisir un résultat</h3><div class="grid2">${fld("ctDate","Date","date",todayISO())}<div class="field"><label for="ctKey">Test</label><select id="ctKey">${types.map(t=>`<option value="${esc(t.key)}">${esc(t.name)} (${esc(t.unit)})</option>`).join("")}</select></div></div>
    ${fld("ctVal","Résultat","number","","0.1")}<p class="small" id="ctMsg" role="alert"></p><button class="btn full" type="submit">Enregistrer pour ${esc(accountName(a))}</button>
    <p class="tiny muted">Les charges futures sont recalculées ; les séances déjà réalisées gardent la charge de l'époque.</p></form>
   ${rows.length?rows.map(({t,h})=>{const l=h[h.length-1];const e=t.estimate_1rm||REF_TEST_KEY[t.key]?est1RM(Object.keys(REF_TEST_KEY).find(k=>REF_TEST_KEY[k]===t.key)||t.key):null;
     return `<section class="card"><div class="row between"><h3>${esc(t.name)}</h3>${spark(h.map(p=>({v:p.value})))}</div>${l?`<p class="small">Dernier : <b class="num">${fmt(l.value)} ${esc(t.unit)}</b> le ${fmtShort(l.date)}${h.length>1?" · évolution "+((l.value-h[0].value)>0?"+":"")+fmt(l.value-h[0].value)+" depuis le "+fmtShort(h[0].date):""}</p>`:'<p class="small muted">Aucun résultat.</p>'}
      ${e?`<p class="small">1RM estimé : <b class="num">${fmt(e.v)} kg</b> <span class="tiny muted">(${esc(e.src)})</span></p>`:""}
      ${h.length?`<details class="fold mini-fold"><summary>Historique (${h.length})</summary><div class="fold-body"><ul class="clean small">${h.slice().reverse().map(p=>`<li>${fmtShort(p.date)} : ${fmt(p.value)} ${esc(t.unit)}</li>`).join("")}</ul></div></details>`:""}</section>`}).join(""):'<p class="small muted">Aucun test enregistré.</p>'}`}
document.addEventListener("submit",ev=>{if(ev.target.id!=="caTestForm")return;ev.preventDefault();if(!isCoachAccount())return;const uid_=ev.target.dataset.uid;const m=document.getElementById("ctMsg");
  const key=val("ctKey"),date=val("ctDate")||todayISO(),v=num(val("ctVal"),0,100000);if(v===""){m.textContent="Indique le résultat.";return}const t=testType(key);
  writeAthlete(uid_,S=>{const i=S.tests.findIndex(x=>x.date===date);if(i>=0)S.tests[i]={...S.tests[i],[key]:v};else S.tests.push({date,[key]:v,src:"saisi par le coach"});S.tests.sort((a,b)=>a.date<b.date?-1:1)});
  PL.coachLog.unshift({at:nowISO(),by:"coach",uid:uid_,what:"Test saisi : "+(t?t.name:key)+" = "+fmt(v)+" ("+fmtShort(date)+")"});plSave();render();toast("Résultat enregistré")});

/* ---------- Questionnaire : usage réel de chaque réponse ---------- */
const PAIN_OB_TO_ZONE={genou:"genou",cheville:"cheville",dos:"bas_dos",epaule:"epaule",ischios:"ischios",adducteurs:"aine",hanche:"hanche"};
const EQ_NEED=[[/barre(?! de traction)|disque/i,"Barres et disques"],[/rack|cage/i,"Rack ou cage à squat"],[/banc/i,"Banc"],[/halt[èe]re/i,"Haltères"],[/poulie/i,"Poulies"],[/tra[iî]neau/i,"Traîneau"],[/kettlebell/i,"Kettlebells"],[/[ée]lastique/i,"Élastiques"],[/barre de traction/i,"Barre de traction"],[/m[ée]decine|medball/i,"Médecine-ball"],[/machine/i,"Machines guidées"]];
function obOf(clientId){const a=PL.accounts[clientId]||{};const q=a.questionnaire&&Object.keys(a.questionnaire).length?a.questionnaire:null;
  return q||withAthlete(clientId,()=>(S.profile&&S.profile.onboarding)||null)||{}}
/* Contrôles avant attribution / dans l'éditeur, à partir des réponses du client */
function profileChecks(clientId,prog,startDate,startWeek=0){const o=obOf(clientId);const out=[];if(!prog)return out;
  const days=(o.dispo&&o.dispo.days)||null,pref=o.dispo&&+o.dispo.dur;const eq=o.equip||null;const painZ=((o.pain&&o.pain.v)||[]).map(k=>PAIN_OB_TO_ZONE[k]).filter(Boolean);
  const sd=o.sportDetail||{};const matchDays=new Set(Object.values(sd).flatMap(x=>x&&x.matchDays||[]));const sportDays=new Set(Object.values(sd).flatMap(x=>x&&x.days||[]));
  const ss=progSessions(prog).slice(0);const dayKey=d=>String((+d+1)%7); // 0 = lundi dans le programme ; OB_DAYS : "1" = lundi … "0" = dimanche
  ss.forEach(x=>{const ps=x.ps;const dk=dayKey(ps.day);
    if(days&&!days.includes(dk))out.push({k:"dispo",t:`« ${ps.name} » le ${DAYS_L[ps.day].toLowerCase()} : jour non disponible pour ce client.`});
    if(pref&&+ps.dur>pref+10)out.push({k:"duree",t:`« ${ps.name} » dure ${ps.dur} min, plus que la durée préférée (${pref} min).`});
    if((ps.fam==="heavy"||ps.fam==="power")&&[...matchDays].some(m=>m===String((+dk+1)%7)||m===String((+dk+6)%7)))out.push({k:"match",t:`« ${ps.name} » (séance lourde) la veille ou le lendemain d'un jour de match : à éviter (${srcLabel?ruleSrcTxt("legsJ1"):"règle J-1/J+1"}).`});
    if(sportDays.has(dk)&&(ps.fam==="heavy"))out.push({k:"sport",t:`« ${ps.name} » tombe un jour d'entraînement sportif.`});
    (ps.main||[]).forEach(r=>{if(eq){const need=EQ_NEED.filter(([re])=>re.test(exLib(r.n).equip||"")).map(x=>x[1]);const have=eq.cat==="aucun"?[]:(eq.items||[]);const miss=need.filter(n=>!have.includes(n));
        if(need.length&&miss.length)out.push({k:"materiel",t:`« ${r.n} » : matériel absent (${miss.join(", ")}).`})}
      painZ.forEach(z=>{if(painHits({n:r.n,z:exLib(r.n).z||[]},z))out.push({k:"douleur",t:`« ${r.n} » sollicite une zone déclarée douloureuse (${PAIN_ZL(z).toLowerCase()}) : à valider.`})})})});
  const lvl=o.exp&&o.exp.v;if(lvl&&prog.level){const g=(OB_EXP.find(x=>x[0]===lvl)||[])[2]||0;if(prog.level==="avance"&&g<=2||prog.level==="competition"&&g<=3)out.push({k:"niveau",t:`Programme « ${PROG_LEVELS.find(x=>x[0]===prog.level)[1]} » pour un client dont l'expérience est « ${optLabel(OB_EXP,lvl)} ».`})}
  const seen=new Set();return out.filter(x=>!seen.has(x.t)&&seen.add(x.t))}
const ruleSrcTxt=k=>{try{return ruleJustif(k)}catch(e){return "règle J-1 / J+1"}};
const CHK_L={dispo:"Disponibilités",duree:"Durée",match:"Matchs",sport:"Sport",materiel:"Matériel",douleur:"Douleurs déclarées",niveau:"Niveau"};
const checksHtml=L=>L.length?`<div class="alert"><span class="dot"></span><div><b>${L.length} point${L.length>1?"s":""} à vérifier d'après le questionnaire du client</b><ul class="clean small">${L.slice(0,12).map(x=>`<li><b>${esc(CHK_L[x.k])} :</b> ${esc(x.t)}</li>`).join("")}</ul>${L.length>12?`<p class="tiny">… et ${L.length-12} autre(s).</p>`:""}</div></div>`:`<p class="small muted">Aucun conflit détecté avec le questionnaire du client.</p>`;
/* Fiche client › Profil et questionnaire : chaque réponse et ce qu'elle change réellement */
function caProfil(a){const o=obOf(a.id);const L=(list,k)=>optLabel(list,k);const asg=assignmentOf(a.id);
  const R=[
   ["Objectifs",o.goals?(o.goals.v||[]).map(k=>L(OB_GOALS,k)).join(", ")+(o.goals.main?" · principal : "+L(OB_GOALS,o.goals.main):""):null,"Affichés au coach ; servent à proposer une formule. Ne modifient pas un programme automatiquement."],
   ["Sports et niveau",o.sports?(o.sports.v||[]).map(k=>L(OB_SPORTS,k)+(o.levels&&o.levels.v&&o.levels.v[k]?" ("+L(OB_LEVELS,o.levels.v[k])+")":"")).join(", "):null,"Affichés au coach."],
   ["Fréquence par sport",o.freq?Object.entries(o.freq.v||{}).map(([k,v])=>L(OB_SPORTS,k)+" : "+v+"/sem.").join(", "):null,"Affichée au coach."],
   ["Calendrier sportif",o.sportDetail?Object.entries(o.sportDetail).map(([k,v])=>L(OB_SPORTS,k)+" : "+(v.days||[]).map(d=>L(OB_DAYS,d)).join(", ")+(v.time?" à "+v.time:"")+(v.dur?" · "+v.dur+" min":"")+((v.matchDays||[]).length?" · matchs "+v.matchDays.map(d=>L(OB_DAYS,d)).join(", "):"")+(v.fixed===false?" · variable":"")).join(" ; "):null,"UTILISÉ : contrôle des séances lourdes la veille ou le lendemain d'un match et des séances lourdes un jour d'entraînement."],
   ["Expérience en musculation",o.exp?L(OB_EXP,o.exp.v):null,"UTILISÉE : alerte si le niveau du programme attribué est trop élevé."],
   ["Sexe",o.sex?L([["femme","Femme"],["homme","Homme"]],o.sex.v):null,"Enregistré, sans effet automatique."],
   ["Poids, taille, âge",o.body?[isNum(o.body.kg)?fmt(o.body.kg)+" kg":null,o.body.height?o.body.height+" cm":null,o.body.birth?"né(e) en "+o.body.birth:null].filter(Boolean).join(" · "):null,"Poids UTILISÉ : poids de corps des tractions lestées et du suivi. Taille et âge : enregistrés, sans effet automatique."],
   ["Disponibilités",o.dispo?(o.dispo.days||[]).map(k=>L(OB_DAYS,k)).join(", ")+" · "+(o.dispo.dur||"—")+" min":null,"UTILISÉES : alerte si une séance tombe un jour indisponible ou dépasse la durée préférée."],
   ["Équipement",o.equip?({salle:"Salle",domicile:"Domicile",aucun:"Aucun matériel"}[o.equip.cat]||"—")+((o.equip.items||[]).length?" : "+o.equip.items.join(", "):""):null,"UTILISÉ : alerte si un exercice demande un matériel absent."],
   ["Douleurs ou limitations",o.pain?(o.pain.v||[]).map(k=>L(OB_PAIN,k)).join(", ")+(o.pain.txt?" · "+o.pain.txt:""):null,"UTILISÉES : alerte si un exercice sollicite une zone déclarée. Aucun diagnostic."],
   ["Appareils",o.devices?(o.devices.v||[]).map(k=>L(OB_DEVICES,k)).join(", "):null,"Enregistrés, sans effet automatique (connexion Polar proposée dans les réglages de l'athlète)."],
   ["Attentes",o.expect?(o.expect.v||[]).map(k=>L(OB_EXPECT,k)).join(", "):null,"UTILISÉES : formule conseillée à l'inscription."],
   ["Formule",a.formula?(PL.formulas[a.formula]||{}).name:(a.formulaRequest?"demandée : "+(PL.formulas[a.formulaRequest.k]||{}).name:null),"UTILISÉE : droits d'accès (messagerie, calcul des charges, adaptations, suivi…) appliqués par le serveur."]];
  return `<section class="card"><h3>Réponses et utilisation réelle</h3><div class="tablewrap"><table class="q-use"><thead><tr><th>Information</th><th>Réponse</th><th>Ce qu'elle change</th></tr></thead><tbody>${R.map(([k,v,u])=>`<tr><td>${esc(k)}</td><td>${v?esc(v):'<span class="muted">Non renseigné</span>'}</td><td class="small">${esc(u)}</td></tr>`).join("")}</tbody></table></div>
   <p class="tiny muted" style="margin-top:6px">Aucune individualisation n'est annoncée pour une réponse seulement enregistrée.</p></section>
   ${asg&&!asg.prog.engine?`<section class="card stack tight"><h3>Contrôle du programme attribué</h3>${checksHtml(profileChecks(a.id,asg.prog,asg.startDate,asg.startWeek))}</section>`:""}`}
document.addEventListener("change",ev=>{if(ev.target.id!=="asClient")return;const b=document.querySelector('[data-pe="doAssign"]');const p=b&&PL.programs[b.dataset.id];const box=document.getElementById("asChecks");
  if(p&&box){const mt=missingTestsFor(p,ev.target.value);box.innerHTML=checksHtml(profileChecks(ev.target.value,p))+(mt.length?`<div class="alert"><span class="dot"></span><div class="small"><b>Tests manquants :</b> ${mt.map(r=>esc(refLabel(r))).join(", ")}.</div></div>`:"")}});
/* =====================================================================
   DOMAINE · COACH · PROGRAMMES (création, duplication, édition, attribution, personnalisation)
   Fonctionne réellement avec les données locales (PL.programs, PL.assignments).
   ===================================================================== */
let CEDIT=null;   // {kind:"tpl"|"asg", id} : programme ouvert dans l'éditeur
let PSD=null;     // brouillon de la séance en cours d'édition {ps, wid, isNew}
let LIBF="all";   // filtre de la bibliothèque
const editProg=()=>!CEDIT?null:CEDIT.kind==="tpl"?PL.programs[CEDIT.id]:(PL.assignments[CEDIT.id]||{}).prog;
const editAsg=()=>CEDIT&&CEDIT.kind==="asg"?PL.assignments[CEDIT.id]:null;
function progChanged(what){const p=editProg();if(!p)return;if(CEDIT.kind==="tpl")touchProgram(p,what);else asgLog(editAsg(),what);plSave()}
const progUsers=p=>Object.values(PL.assignments).filter(a=>a.programId===p.id&&a.status==="active");
/* ---------- Liste des programmes ---------- */
function coachPrograms(){
  if(CEDIT)return programEditor();
  const ps=Object.values(PL.programs).sort((a,b)=>(a.status==="archived")-(b.status==="archived")||String(b.updatedAt).localeCompare(String(a.updatedAt)));
  return ch("Programmes")+`<div class="stack">
   <div class="row"><button class="btn" data-pe="create">${ICONS.plus}Créer un programme</button></div>
   ${ps.length?ps.map(p=>{const st=progStats(p),us=progUsers(p);return `<section class="card prog-card"><div class="row between"><h3>${esc(p.name)}</h3><span class="chip ${p.status==="active"?"st-done":p.status==="draft"?"st-todo":"st-future"}">${esc(PROG_STATUS[p.status]||p.status)}</span></div>
    <p class="small muted">${esc(p.goal||p.description||"Sans objectif renseigné")}${p.engine?" · séances calculées par le moteur historique (matchs réels)":""}</p>
    <p class="small">${st.weeks} semaine${st.weeks>1?"s":""} · ${st.sessions} séance${st.sessions>1?"s":""} · ${st.sets} séries · version ${p.version||1}${us.length?" · attribué à "+us.map(a=>esc(accountName(PL.accounts[a.clientId]))).join(", "):""}</p>
    <div class="row">${p.engine?`<button class="btn secondary small" data-pe="open" data-id="${p.id}">Consulter</button>`:`<button class="btn secondary small" data-pe="open" data-id="${p.id}">Modifier</button>`}<button class="btn ghost small" data-pe="dup" data-id="${p.id}">Dupliquer</button>${p.engine?"":`<button class="btn ghost small" data-pe="assign" data-id="${p.id}">Attribuer</button>`}${p.engine?"":p.status!=="archived"?`<button class="btn ghost small" data-pe="archive" data-id="${p.id}">Archiver</button>`:`<button class="btn ghost small" data-pe="unarchive" data-id="${p.id}">Réactiver</button>`}</div></section>`}).join(""):`<section class="card"><p class="small">Aucun programme. Crée ton premier modèle : blocs, semaines, séances et exercices.</p></section>`}
   <p class="tiny muted">Un modèle n'est jamais modifié par une attribution : chaque client reçoit une copie que tu peux personnaliser dans sa fiche.</p></div>`}
/* ---------- Éditeur ---------- */
function programEditor(){const p=editProg();if(!p){CEDIT=null;return coachPrograms()}
  const asg=editAsg();const ro=!!p.engine;const st=progStats(p);
  let h=ch(asg?"Programme de "+accountName(PL.accounts[asg.clientId]):p.name,asg?"Personnalisation (le modèle d'origine n'est pas modifié)":"Éditeur de programme",`<button class="btn ghost small" data-pe="close">${ICONS.back}${asg?"Fiche":"Programmes"}</button>`)+`<div class="stack">`;
  if(ro)h+=`<div class="demo-banner" role="note">Programme historique migré : ses séances réelles sont recalculées par le moteur selon les matchs, les entraînements à Caen et les semaines de cours. Ce modèle est affiché en lecture seule ; « Dupliquer » en fait une copie modifiable pour d'autres clients.</div>`;
  if(!asg)h+=`<section class="card stack"><h3>Informations</h3>
   <div class="grid2">${fld("pmName","Nom","text",p.name,null,ro?"disabled":"")}${fld("pmSport","Sport (facultatif)","text",p.sport||"",null,ro?"disabled":"")}</div>

/* Stockage et médias : compression, taille, limites, alerte avant dépassement */
function storageUse(){let b=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);b+=(k.length+(localStorage.getItem(k)||"").length)*2}}catch(e){}return{bytes:b,pct:Math.round(b/(5*1024*1024)*100)}}
const fmtKb=b=>b>1048576?fmt(b/1048576,1)+" Mo":Math.round(b/1024)+" ko";
const MEDIA_MAX_IN=8*1024*1024;
function libPhotoK(name,k,file){
  if(!/^image\/(jpeg|png|webp)$/.test(file.type)){toast("Format accepté : JPEG, PNG ou WebP");return}
  if(file.size>MEDIA_MAX_IN){toast("Image trop lourde (8 Mo maximum)");return}
  const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),q=Math.min(1,720/Math.max(img.width,img.height));c.width=Math.round(img.width*q);c.height=Math.round(img.height*q);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const data=c.toDataURL("image/jpeg",.78);if(Cloud.isCloud()){uploadMedia(name,k,dataUrlBlob(data),"image/jpeg");return}const add=data.length*2;const u=storageUse();
    if(u.bytes+add>4.5*1024*1024){toast("Stockage presque plein : retire d'abord un média");return}
    const L=PL.library[name]=PL.library[name]||{};const prev=L[k];L[k]=data;if(!L.rights)L.rights="Photo ajoutée par le coach";
    if(!plSave()){if(prev)L[k]=prev;else delete L[k];toast("Stockage plein : photo non enregistrée");return}
    PL.coachLog.unshift({at:nowISO(),by:"coach",what:"Photo ajoutée ("+k+") : "+name+" · "+fmtKb(data.length*.75)});plSave();
    if(sheetMode==="libEdit")openLibEdit(name);render();toast("Photo enregistrée ("+fmtKb(data.length*.75)+")")};img.onerror=()=>toast("Image illisible");img.src=r.result};r.readAsDataURL(file)}

   case "dupWeek":{for(const b of p.blocks){const i=b.weeks.findIndex(w=>w.id===el.dataset.w);if(i>=0){const c=deep(b.weeks[i]);c.id=pid("pw");c.label=(c.label||"Semaine")+" (copie)";c.sessions.forEach(s=>s.id=pid("ps"));b.weeks.splice(i+1,0,c);break}}progChanged("Semaine dupliquée");render();break}
   case "delWeek":{for(const b of p.blocks){const w=b.weeks.find(x=>x.id===el.dataset.w);if(w){if(w.sessions.length&&!el.dataset.ok){el.dataset.ok=1;el.textContent="Confirmer";return}b.weeks=b.weeks.filter(x=>x!==w)}}p.blocks=p.blocks.filter(b=>b.weeks.length||p.blocks.length===1);progChanged("Semaine supprimée");render();break}

   case "dupSession":{const f=findPs(p,el.dataset.ps);const c=deep(f.ps);c.id=pid("ps");c.name=f.ps.name+" (copie)";f.w.sessions.push(c);progChanged("Séance dupliquée : "+f.ps.name);render();toast("Séance dupliquée");break}

function psChecks(ps){const out=[];const est=estimatePs(ps);const dur=+ps.dur||0;
  if(dur&&Math.abs(est-dur)>Math.max(10,dur*.2))out.push({k:"warn",t:`Durée annoncée ${dur} min, estimation ${est} min : l'écart dépasse ${Math.max(10,Math.round(dur*.2))} min. Ajuste la durée annoncée ou le contenu.`});
  if(!(ps.main||[]).filter(r=>r.n).length)out.push({k:"err",t:"Aucun exercice dans le corps de séance."});
  const p=editProg();if(p&&(ps.fam==="heavy"||ps.fam==="power")){const L=progWeeks(p);const wi=L.findIndex(x=>x.w.id===PSD.wid||x.w.sessions.some(s=>s.id===ps.id));
    const abs=(w,d)=>w*7+(+d);const me_=abs(wi,ps.day);
    L.forEach((x,i)=>x.w.sessions.forEach(o=>{if(o.id===ps.id||!(o.fam==="heavy"||o.fam==="power"))return;const g=Math.abs(abs(i,o.day)-me_);
      if(g<2)out.push({k:"warn",t:`« ${o.name} » (${FAM_L[o.fam].toLowerCase()}) est ${g===0?"le même jour":"la veille ou le lendemain"} : deux séances lourdes à moins de 48 h. Repère du cours : ${srcLabel("FORCE_P18")}.`})}))}
  const refs=[...new Set((ps.main||[]).filter(r=>r.presc&&["pct1rm","pctTest"].includes(r.presc.mode)).map(r=>r.presc.ref).filter(Boolean))];
  const bad=(ps.main||[]).filter(r=>r.presc&&["pct1rm","pctTest"].includes(r.presc.mode)&&(!r.presc.ref||!isNum(r.presc.pct)));
  bad.forEach(r=>out.push({k:"err",t:`« ${r.n||"Exercice"} » : pourcentage ou référence manquant.`}));
  const asg=editAsg();if(asg&&refs.length){const miss=withAthlete(asg.clientId,()=>refs.filter(ref=>!(est1RM(ref)||lastTest(REF_TEST_KEY[ref]||ref))));
    if(miss.length)out.push({k:"warn",t:`Tests manquants pour ${accountName(PL.accounts[asg.clientId])} : ${miss.map(refLabel).join(", ")}. L'athlète verra « Test requis pour calculer cette charge ».`})}
  else if(refs.length)out.push({k:"info",t:"Tests nécessaires pour calculer les charges : "+refs.map(refLabel).join(", ")+"."});
  return out}

  return `<div class="sheet-scroll">`+head(ro?"Consultation":"Séance · étape "+step+"/4",esc(ps.name||"Nouvelle séance"))+bar+`<form id="psForm" class="stack" onsubmit="return false">

  if(has("psWuMin"))ps.wuMin=num(val("psWuMin"),0,60)||0;if(has("psCdMin"))ps.cdMin=num(val("psCdMin"),0,60)||0;

   - Plus aucun média lourd dans localStorage en production : photos (compressées sur l'appareil, 720 px, JPEG)
     et vidéos (MP4/MOV, 50 Mo max) vont dans le compartiment privé « exercise-media/<coach>/<exercice>/ ».
   - Formats et tailles contrôlés deux fois : dans l'appli et par le serveur (règles du compartiment).
   - Lecture par URL signée temporaire (1 h) ; les clients ne voient que les fiches PUBLIÉES de LEUR coach.

const MEDIA_URLS={};let MEDIA_FETCH=new Set();

function mediaSrc(v){if(!isSbMedia(v))return v;const path=v.slice(3);const c=MEDIA_URLS[path];if(c&&c.exp>Date.now())return c.url;
  if(Cloud.isCloud()&&!MEDIA_FETCH.has(path)){MEDIA_FETCH.add(path);Cloud.sb.storage.from("exercise-media").createSignedUrl(path,3600).then(r=>{MEDIA_FETCH.delete(path);
    if(r.data&&r.data.signedUrl){MEDIA_URLS[path]={url:r.data.signedUrl,exp:Date.now()+3500e3};document.querySelectorAll(`[data-sbmedia="${CSS.escape(path)}"]`).forEach(el=>{el.src=r.data.signedUrl})}})}
  return ""}
const mediaAttr=v=>isSbMedia(v)?` data-sbmedia="${esc(v.slice(3))}"`:"";
function dataUrlBlob(d){const [h,b]=d.split(",");const mime=(/data:([^;]+)/.exec(h)||[])[1]||"image/jpeg";const bin=atob(b);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return new Blob([a],{type:mime})}

const libRow=(name,c)=>{const f=exLib(name);return{coach_id:sidOf("coach"),name,category:c.cat||f.cat||"",cues:(c.cues&&c.cues.length?c.cues:f.cues)||[],errors:(c.errors&&c.errors.length?c.errors:f.errors)||[],

async function ensureExerciseRow(name){const c=PL.library[name]||{};const r=await Cloud.sb.from("exercises").upsert(libRow(name,c),{onConflict:"coach_id,name"}).select("id").single();if(r.error)throw r.error;return r.data.id}
async function uploadMedia(name,k,blob,mime){
  if(!Cloud.isCloud())return false;if(navigator.onLine===false){toast("Connexion requise pour envoyer un média");return false}
  const c=PL.library[name]=PL.library[name]||{};if(!c.rights||c.rights.trim().length<3){toast("Indique d'abord l'origine et les droits d'utilisation du média (champ « Droits »), puis enregistre la fiche.");return false}
  const okMime=["image/jpeg","image/png","image/webp","video/mp4","video/quicktime"];if(!okMime.includes(mime)){toast("Format non accepté");return false}
  if(blob.size>(mime.startsWith("video")?50:10)*1024*1024){toast(mime.startsWith("video")?"Vidéo trop lourde (50 Mo maximum)":"Image trop lourde");return false}
  const view={photo:"main",photoFront:"front",photoSide:"side",video:"video"}[k]||"main";
  const path=`${sidOf("coach")}/${slugEx(name)}/${view}-${Date.now().toString(36)}.${mime==="video/quicktime"?"mov":mime.split("/")[1].replace("jpeg","jpg")}`;
  toast("Envoi du média…");
  try{const exId=await ensureExerciseRow(name);
    const up=await Cloud.sb.storage.from("exercise-media").upload(path,blob,{contentType:mime,upsert:false});if(up.error)throw up.error;
    const ins=await Cloud.sb.from("exercise_media").insert({exercise_id:exId,coach_id:sidOf("coach"),view,storage_path:path,mime,bytes:blob.size,rights:c.rights,status:(c.status==="publie"?"published":"draft")});
    if(ins.error){await Cloud.sb.storage.from("exercise-media").remove([path]);throw ins.error}
    const prev=c[k];c[k]="sb:"+path;PL.coachLog.unshift({at:nowISO(),by:"coach",what:"Média envoyé ("+view+") : "+name+" · "+fmtKb(blob.size)});plSave();
    if(isSbMedia(prev))await deleteMedia(prev.slice(3));
    if(sheetMode==="libEdit")openLibEdit(name);render();toast("Média enregistré sur le serveur");return true}
  catch(e){toast("Envoi impossible : "+(e.message||"erreur serveur"));return false}}
async function deleteMedia(path){try{await Cloud.sb.storage.from("exercise-media").remove([path]);await Cloud.sb.from("exercise_media").delete().eq("storage_path",path)}catch(e){}}

/* Rappel « séance pas terminée » : notification native à fin estimée + 30 min, puis + 90 min (appli iPhone).
   Dans le navigateur : la question est posée à la prochaine ouverture (checkForgotten), jamais de durée inventée. */
Notify.scheduleForgot=async function(id,estEnd){
  if(!this.native()||!isNum(estEnd))return false;
  try{const LN=window.Capacitor.Plugins.LocalNotifications;const p=await LN.checkPermissions();if(p.display!=="granted")return false;
    const base=Math.abs([...("fg"+id)].reduce((h,c)=>((h<<5)-h+c.charCodeAt(0))|0,7))%1000000000;
    await LN.schedule({notifications:[
      {id:base,title:"Séance toujours en cours ?",body:"Tu n'as pas terminé ta séance. Indique l'heure de fin.",schedule:{at:new Date(estEnd+FORGOT_MARGIN)}},
      {id:base+1,title:"Durée à confirmer",body:"Ta séance n'est pas terminée dans l'appli. Ouvre-la pour indiquer l'heure de fin.",schedule:{at:new Date(estEnd+3*FORGOT_MARGIN)}}]});
    return true}catch(e){return false}
};
Notify.cancelForgot=async function(id){if(!this.native())return;try{const base=Math.abs([...("fg"+id)].reduce((h,c)=>((h<<5)-h+c.charCodeAt(0))|0,7))%1000000000;await window.Capacitor.Plugins.LocalNotifications.cancel({notifications:[{id:base},{id:base+1}]})}catch(e){}};

  const refresh=()=>{obSave();render()};
  if((el=q("[data-obm]"))){const [k,o]=el.dataset.obm.split(":");const v=a()[k]=a()[k]||{};let sel=v.v||[];const step=OB_STEPS.find(x=>x.k===k)||{};

    if(sel.includes(o))sel=sel.filter(x=>x!==o);else sel=o===excl?[o]:[...sel.filter(x=>x!==excl),o];
    v.v=sel;if(k==="goals"){if(!sel.includes(v.main))v.main=sel.length===1?sel[0]:null;if(sel.length===1)v.main=sel[0]}
    if(!sel.includes("autre"))delete v.other;refresh();return true}
  if((el=q("[data-obs]"))){const [k,o]=el.dataset.obs.split(":");a()[k]={...(a()[k]||{}),v:o};if(o!=="autre")delete a()[k].other;obSave();
    if(o==="autre"){render();const i=document.getElementById("obOther_"+k);i&&i.focus();return true}

async function cloudAccount(){
  const first=val("acFirst").trim(),last=val("acLast").trim(),email=val("acEmail").trim().toLowerCase(),pass=val("acPass");const msg=document.getElementById("acMsg");
  const ok=document.getElementById("acConsent");const b=document.querySelector('#accountForm [type=submit]');

  if(String(pass).length<10){msg.textContent="Le mot de passe doit contenir au moins 10 caractères.";return}
  if(ok&&!ok.checked){msg.textContent="Coche la case de consentement pour créer ton compte.";ok.focus();return}
  busy(b,true,"Création du compte…");

    const inv=AUTH.invite;

      await Cloud.signIn(r.email||email,pass);await afterCloudAuth(true);return}

}

function donePhrase(s,adapted,n){
  const T=tpl(s);
  if(adapted)return "Adapter, c'est s'entraîner intelligemment. Bien joué d'avoir écouté ton corps.";
  if(n>=5)return n+" séances d'affilée : ta régularité fait la différence.";
  if(T.fam==="heavy")return "Grosse séance de force bouclée. Récupère bien : sommeil et repas complet.";
  if(T.fam==="power")return "Puissance travaillée, jambes fraîches pour le terrain. Bien joué.";
  if(T.fam==="upper")return "Haut du corps validé. Une séance de plus vers ton objectif.";
  return "Séance validée. Chaque séance compte.";
}

let TIMER=null;
function startTimer(sec,label){stopTimer();TIMER={end:nowMs()+sec*1000,label,iv:setInterval(drawTimer,250)};drawTimer()}

function drawTimer(){const el=document.getElementById("restTimer");if(!TIMER)return;if(!el){stopTimer();return}
  const left=Math.max(0,Math.round((TIMER.end-nowMs())/1000));
  el.innerHTML=`<div class="timer" role="timer" aria-live="off"><span class="grow"><span class="tiny">Repos · ${esc(TIMER.label)}</span><br><b class="num">${left?Math.floor(left/60)+":"+pad(left%60):"Terminé"}</b></span><button type="button" data-act="timerPlus">+15 s</button><button type="button" data-act="timerStop">Arrêter</button></div>`;
  if(!left){clearInterval(TIMER.iv);try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
}

function liveStats(a){
  const r=a.rec;const hm=+S.settings.hrMax;
  const cur=a.lastAt&&nowMs()-a.lastAt<5000?a.lastHr:null;
  if(!r)return{cur,avg:null,max:null,dur:0,zones:null,zone:cur&&hm?zoneOf(cur,hm):null};
  const v=r.samples.map(x=>x[1]);const dur=Math.round((((r.pauseAt||nowMs())-r.start-r.pausedMs))/1000);
  const zones=hm?[0,0,0,0,0]:null;if(zones)r.samples.forEach(x=>{const z=zoneOf(x[1],hm);if(z>=0)zones[z]++});
  return{cur,avg:v.length?Math.round(v.reduce((p,q)=>p+q,0)/v.length):null,max:v.length?Math.max(...v):null,dur,zones,zone:cur&&hm?zoneOf(cur,hm):null};
}

function wbSet(track,v){
  const k=track.dataset.wb,it=WB_ITEMS.find(i=>i.k===k);v=Math.max(0,Math.min(100,Math.round(v)));WB.items[k]=v;
  track.classList.add("is-set");track.setAttribute("aria-valuenow",v);track.setAttribute("aria-valuetext",wbText(it,v));

  const n=wbCount();const c=document.getElementById("wbCount");if(c)c.textContent=n<5?n+" / 5 réponses":"Toutes les réponses sont données";
  const b=document.getElementById("wbSave");if(b)b.disabled=n<5;

function wbFromX(track,x){const r=track.getBoundingClientRect();const pad=19;return (x-r.left-pad)/(r.width-2*pad)*100}
let wbDrag=null;
document.addEventListener("pointerdown",ev=>{const tr=ev.target.closest(".wb-track");if(!tr||!WB)return;wbDrag={tr,x:ev.clientX,y:ev.clientY,id:ev.pointerId,moved:false};wbSet(tr,wbFromX(tr,ev.clientX))});

document.addEventListener("keydown",ev=>{const tr=ev.target.closest&&ev.target.closest(".wb-track");if(!tr||!WB)return;const cur=isNum(WB.items[tr.dataset.wb])?+WB.items[tr.dataset.wb]:50;

/* =====================================================================
   MODULE 21 · RAPPELS DU QUESTIONNAIRE DU JOUR
   Une page web ne peut pas envoyer de notification quand elle est fermée sur iPhone (pas de serveur de push ici).
   3 voies, sans rien simuler :
   1. Calendrier (.ics) : événement quotidien avec alerte, géré par l'iPhone lui-même → fonctionne tout de suite.
   2. Appli iOS (pont Capacitor, LocalNotifications) : notifications locales répétées, actives quand l'appli native existe.
   3. Appli ouverte : bandeau de rappel + notification du navigateur si elle est autorisée.
   ===================================================================== */
const REM_DAYS=[[1,"L","MO"],[2,"M","TU"],[3,"M","WE"],[4,"J","TH"],[5,"V","FR"],[6,"S","SA"],[0,"D","SU"]];
const remCfg=()=>{const r=S.settings.wbRem;return isObj(r)?{on:!!r.on,times:Array.isArray(r.times)&&r.times.length?r.times.filter(x=>/^\d{2}:\d{2}$/.test(x)).slice(0,3):["08:00"],days:Array.isArray(r.days)?r.days.filter(d=>d>=0&&d<=6):[0,1,2,3,4,5,6]}:{on:false,times:["08:00"],days:[0,1,2,3,4,5,6]}};
let REMD=null;
function openReminders(){REMD=remCfg();sheetMode="rem";openSheet(sheetReminders(),"Rappels du questionnaire")}
function sheetReminders(){
  const r=REMD,nat=Notify.native();
  return `<div class="sheet-scroll">`+head("Questionnaire du jour","Rappels")+`<div class="stack">
   <label class="row between card" style="cursor:pointer;flex-wrap:nowrap;gap:12px"><span><b>Activer les rappels</b><br><span class="small muted">Seulement les jours où le questionnaire n'est pas encore rempli quand l'appli est ouverte.</span></span><input type="checkbox" id="remOn" ${r.on?"checked":""} style="width:26px;height:26px;flex:none"></label>
   <div class="field"><span class="lbl">Heures (3 maximum)</span>
    ${r.times.map((t,i)=>`<div class="row" style="gap:8px;margin-bottom:8px"><input type="time" id="remT${i}" value="${t}" aria-label="Heure du rappel ${i+1}" style="flex:1">${r.times.length>1?`<button type="button" class="btn ghost small" data-remdel="${i}" aria-label="Supprimer ce rappel">Retirer</button>`:""}</div>`).join("")}
    ${r.times.length<3?`<button type="button" class="btn secondary small" data-act="remAdd">+ Ajouter une heure</button>`:""}</div>
   <div class="field"><span class="lbl" id="remDL">Jours</span><div class="toggles" role="group" aria-labelledby="remDL">${REM_DAYS.map(([d,l])=>`<button type="button" class="toggle" data-remday="${d}" aria-pressed="${r.days.includes(d)}" aria-label="${JOURS_C[d]}">${l}</button>`).join("")}</div></div>
   <section class="card"><h3>Comment tu seras prévenu</h3><ul class="clean small" style="margin-top:6px">
    <li><b>Calendrier de ton iPhone (recommandé)</b> : un rappel quotidien avec alerte, même appli fermée. Après avoir enregistré, touche « Ajouter à mon calendrier » et ouvre le fichier.</li>
    <li><b>Appli ouverte</b> : bandeau de rappel à l'heure choisie${"Notification" in window?", et notification du navigateur si tu l'autorises":""}.</li>
    <li><b>Appli iOS</b> : ${nat?"notifications programmées sur ton iPhone.":"notifications automatiques quand l'appli native sera installée (pas encore le cas)."}</li></ul>
    <p class="tiny muted" style="margin-top:6px">Sur iPhone, une page web ne peut pas envoyer de notification quand elle est fermée : c'est pour ça que le calendrier est la solution la plus fiable.</p></section>
  </div></div><div class="sheet-actions"><button class="btn full" data-act="remSave" style="min-height:52px">Enregistrer</button>${remCfg().on?`<button class="btn secondary full" data-act="remIcs">Ajouter à mon calendrier</button>`:""}</div>`;
}
function remRead(){REMD.on=!!(document.getElementById("remOn")||{}).checked;REMD.times=REMD.times.map((t,i)=>{const v=val("remT"+i);return /^\d{2}:\d{2}$/.test(v)?v:t})}
function remRefresh(){setSheet(sheetReminders())}
async function remSave(){
  remRead();if(!REMD.days.length){toast("Choisis au moins un jour");return}
  REMD.times=[...new Set(REMD.times)].sort();S.settings.wbRem={...REMD};save();
  await Notify.scheduleDaily(REMD);
  if(REMD.on&&"Notification" in window&&Notification.permission==="default"){try{await Notification.requestPermission()}catch(e){}}
  render();remRefresh();toast(REMD.on?"Rappels enregistrés : "+REMD.times.map(t=>t.replace(":","h")).join(", "):"Rappels désactivés");
}
function remIcs(){
  const r=remCfg();if(!r.on||!r.days.length)return;
  const start=todayISO()<PERIOD_START?PERIOD_START:todayISO(),d0=start.replace(/-/g,""),until=addDays(todayISO(),365).replace(/-/g,"")+"T235959";
  const byday=REM_DAYS.filter(([d])=>r.days.includes(d)).map(x=>x[2]).join(",");
  const stamp=new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+/,"");
  const ev=r.times.map((t,i)=>{const hm=t.replace(":","");return ["BEGIN:VEVENT","UID:usci-muscu-questionnaire-"+hm+"@usci-muscu","DTSTAMP:"+stamp,"DTSTART:"+d0+"T"+hm+"00","DURATION:PT5M",
    "RRULE:FREQ=WEEKLY;BYDAY="+byday+";UNTIL="+until,"SUMMARY:Questionnaire bien-être ("+APP_CONFIG.name+")","DESCRIPTION:Ouvre "+APP_CONFIG.name+" et remplis ton ressenti du jour (1 min).",
    "BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:Questionnaire bien-être","TRIGGER:PT0M","END:VALARM","END:VEVENT"].join("\r\n")}).join("\r\n");
  const ics="BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//"+APP_CONFIG.name+"//FR\r\nCALSCALE:GREGORIAN\r\n"+ev+"\r\nEND:VCALENDAR\r\n";
  saveFile("rappel-questionnaire-usci-muscu.ics",ics,"text/calendar");
}
async function saveFile(name,data,type){
  try{if(window.claude&&window.claude.use){const dl=await window.claude.use("downloads");if(dl){await dl.save({filename:name,data});toast("Fichier proposé au téléchargement : ouvre-le pour l'ajouter au calendrier");return}}}catch(e){if(e&&e.code==="declined"){toast("Téléchargement annulé");return}}
  try{const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast("Fichier téléchargé : ouvre-le pour l'ajouter au calendrier")}catch(e){toast("Téléchargement impossible ici")}
}
/* Rappel quand l'appli est ouverte : vérifié chaque minute. */
function remDue(){const r=remCfg(),t=todayISO();if(!r.on||!r.days.includes(new Date().getDay()))return null;
  if(S.fatigue[t]&&isNum(S.fatigue[t].score))return null;const now=new Date(),hm=pad(now.getHours())+":"+pad(now.getMinutes());
  const past=r.times.filter(x=>x<=hm);return past.length?past[past.length-1]:null}
let remShown={};
setInterval(()=>{const due=remDue();if(!due)return;const k=todayISO()+due;if(remShown[k])return;remShown[k]=true;
  if(TAB==="home"&&!DLG)render();
  if(document.visibilityState!=="visible"&&"Notification" in window&&Notification.permission==="granted"){try{new Notification("Questionnaire bien-être",{body:"Remplis ton ressenti du jour (1 min)."})}catch(e){}}
},60000);

   ${ad&&ad.mode!=="none"?`<p class="small"><b>Adaptation :</b> ${esc(ADAPT_LABEL[ad.mode])}${ad.reasons&&ad.reasons[0]?" · "+esc(ad.reasons[0]):""}</p>`:""}

   <section class="card"><h3>Déroulé</h3>`;
  const wu=T.wu?WU[T.wu]:null;if(wu)h+=`<p class="small" style="margin-top:6px"><b>${esc(wu.t)}</b></p>`;
  let pc=-1;
  items.forEach((e,i)=>{const L=loadInfo(e);if(!e.removed)pc++;const ei=e.removed?-1:pc;const rows=[];const n=typeof e.sets==="number"?e.sets:(parseInt(e.sets)||1);
    for(let k=1;k<=n;k++){const d=l.sets&&ei>=0&&l.sets[ei+"-"+k];rows.push(`<tr><td>${k}</td><td>${esc(e.reps)}${L&&L.kgNum?" · "+fmt(L.kgNum)+" kg":""}</td><td>${d?(d.skipped?"non faite":(isNum(d.reps)?d.reps+" reps":"faite")+(isNum(d.kg)?" · "+fmt(d.kg)+" kg":"")):"—"}</td></tr>`)}

/* =====================================================================
   DOMAINE · ACCESSIBILITÉ DES FENÊTRES (feuilles, lecteur de séance, fiches d'exécution)
   - Une seule fenêtre active : la plus haute (fiche > feuille > lecteur). Tout le reste devient inerte (attribut inert).
   - Focus bloqué dans la fenêtre active (Tab / Maj+Tab), retour du focus au bouton d'origine à la fermeture.
   - Échap : ferme la fiche ; sur le lecteur, RÉDUIT la séance sans l'arrêter (le chronomètre continue).
   - Fenêtres imbriquées : la fiche ouverte depuis le lecteur rend le lecteur inerte, puis le réactive.
   ===================================================================== */
function topModal(){const mm=[...document.querySelectorAll(".media-modal")];if(mm.length)return mm[mm.length-1];
  if(document.querySelector("#layer [role=dialog]"))return document.getElementById("layer");return document.getElementById("player")}
function syncInert(){const top=topModal();[...document.body.children].forEach(c=>{if(c.tagName==="SCRIPT"||c.classList.contains("toast")||c.id==="sr-live")return;
  const v=!!top&&c!==top&&!c.contains(top);if(v)c.setAttribute("inert","");else c.removeAttribute("inert")})}
new MutationObserver(syncInert).observe(document.body,{childList:true});
(()=>{const l=document.getElementById("layer");if(l)new MutationObserver(syncInert).observe(l,{childList:true})})();
/* Réduire le lecteur : la séance continue (S.active est conservé), la carte « Séance en cours » permet de la reprendre */
function minimizePlayer(){if(!S.active)return;const ret=(document.getElementById("player")||{})._ret;closePlayer();render();
  toast("Séance réduite : elle continue. Reprends-la depuis l'accueil.");const b=document.querySelector('[data-start="'+S.active.id+'"]');(b||(ret&&document.contains(ret)?ret:null)||document.querySelector("#app h1"))?.focus?.({preventScroll:true})}
document.addEventListener("keydown",ev=>{const top=topModal();if(!top||top.id==="layer")return; // les feuilles ont leur propre gestion (50-sheets.js)
  if(ev.key==="Escape"){ev.preventDefault();if(top.classList.contains("media-modal"))closeMedia();else if(top.id==="player")minimizePlayer();return}
  if(ev.key==="Tab"){const f=[...top.querySelectorAll(FOCUSABLE)].filter(e=>e.offsetParent!==null&&!e.closest("[hidden]"));if(!f.length){ev.preventDefault();return}
    const first=f[0],last=f[f.length-1];
    if(!top.contains(document.activeElement)){ev.preventDefault();first.focus();return}
    if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}}
});
/* Bouton « Retour » matériel (Android / navigateur) : réduit le lecteur au lieu de quitter l'appli */
window.addEventListener("popstate",()=>{if(document.querySelector(".media-modal")){closeMedia()}else if(document.getElementById("player")){minimizePlayer()}});

/* =====================================================================
   DOMAINE · BADGE DE L'HÉBERGEUR
   Sur l'offre gratuite de Netlify, l'hébergeur ajoute en bas à droite un badge « Powered by Netlify »
   impossible à masquer (il fait partie de l'offre). Pour qu'il ne recouvre jamais un bouton (barre d'onglets,
   lecteur de séance, feuilles), l'appli réserve sa hauteur en bas de l'écran (variable CSS --host-badge).
   Disparaît tout seul avec une offre payante ou un autre hébergeur.
   ===================================================================== */
(function(){const set=()=>{const f=document.getElementById("nl-badge-frame");const h=f&&f.getBoundingClientRect().height;
    document.documentElement.style.setProperty("--host-badge",h?Math.ceil(h+8)+"px":"0px");
    if(f&&!f._watched){f._watched=1;[300,1200,3000].forEach(t=>setTimeout(set,t))}};
  try{new MutationObserver(set).observe(document.body,{childList:true});addEventListener("resize",set)}catch(e){}})();
/* =====================================================================
   DOMAINE · DONNÉES PERSONNELLES (export complet, suppression complète)

   d'autres clients. Suppression : nettoyage réel de TOUTES les structures locales ; ce qui doit rester (journaux) est anonymisé.
   Côté serveur : voir docs/DONNEES-RGPD.md.
   ===================================================================== */

  try{const blob=new Blob([text],{type:mime});const u=URL.createObjectURL(blob);const a=document.createElement("a");a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("Fichier téléchargé");return true}catch(e){return false}}

/* Nettoyage réel de toutes les structures locales. Renvoie le résumé de ce qui a été fait. */
function purgeAccount(uid){const out=[];const ref=anonRef(uid);const acc=PL.accounts[uid];const nm=acc?accountName(acc):"";
  try{localStorage.removeItem(dataKeyFor(uid));out.push("données sportives")}catch(e){}
  if(uid===LUCAS.uid){Object.keys(localStorage).filter(k=>k.startsWith("usci-muscu-backup-")||k.startsWith("usci-muscu-state-v1-illisible")).forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});out.push("sauvegardes de migration")}
  delete PL.accounts[uid];out.push("compte et profil");
  const before=msgList().length;
  if(isObj(PL.msgs)&&Array.isArray(PL.msgs.list)){PL.msgs.list=PL.msgs.list.filter(m=>m.th!==uid).map(m=>m.th==="group"&&m.who===uid?{...m,who:ref,media:null,anonymized:true}:m)}
  out.push((before-msgList().length)+" messages privés supprimés");
  PL.callRequests=(PL.callRequests||[]).filter(c=>c.uid!==uid);
  Object.keys(PL.assignments||{}).forEach(id=>{if(PL.assignments[id].clientId===uid)delete PL.assignments[id]});out.push("programme attribué");
  (PL.invites||[]).forEach(i=>{if(i.usedBy===uid){i.usedBy=ref;i.draft={formula:i.draft.formula,programId:i.draft.programId,anonymized:true}}});
  (PL.coachLog||[]).forEach(l=>{if(l.uid===uid){l.uid=ref;l.what=nm?l.what.split(nm).join(ref):l.what}else if(nm&&l.what&&l.what.includes(nm))l.what=l.what.split(nm).join(ref)});
  if(PL.onboardDraft&&PL.onboardDraft.accountId===uid)PL.onboardDraft=null;
  PL.meta.deletions=PL.meta.deletions||[];PL.meta.deletions.push({ref,at:nowISO()});
  plSave();out.push("références anonymisées");return out}

function readZones(prefix,from){const z=[];for(let i=from;i<from+5;i++)z.push(num(val(prefix+i),0,300));return z.some(isNum)?z:null}
document.addEventListener("click",ev=>{
  const tg=ev.target;
  if(tg.closest(".media-modal")&&tg.closest('[data-act="closeMedia"]')){closeMedia();return}
  if(tg.closest(".media-modal")&&tg.closest("[data-padapt]")){playerAdapt(tg.closest("[data-padapt]").dataset.padapt);return}
  const tab=tg.closest("[data-tab]");if(tab){goTo(tab.dataset.tab);return}
  if(suppressClick){suppressClick=false;return}
  const q=s=>tg.closest(s);
  let el;
  /* ---- Lecteur de séance ---- */
  if(tg.closest("#player")){
    if((el=q("[data-media]"))){openMedia(+el.dataset.media);return}
    if((el=q("[data-warm]"))){openWarm(el.dataset.warm);return}
    if((el=q("[data-recst]"))){document.querySelectorAll("[data-recst]").forEach(b=>b.setAttribute("aria-checked",b===el?"true":"false"));const w=document.getElementById("recAdapt");if(w)w.hidden=el.dataset.recst!=="adapted";return}
    if((el=q("[data-reason]"))){pickReason(el);return}
    const pa=q("[data-act]");if(pa)switch(pa.dataset.act){
      case "playerMin":minimizePlayer();return;

/* ---------- Polar : actions ---------- */
async function polarScan(){const a=POLAR.adapter;POLAR.error=null;POLAR.devices=[];
  try{const list=await a.scan();list.forEach(d=>{if(!POLAR.devices.some(x=>x.id===d.id))POLAR.devices.push(d)});if(POLAR.devices.length===1&&a.kind==="simulation")await polarConnect(POLAR.devices[0].id);else updatePolarUI()}
  catch(e){POLAR.error=e.message;if(a.kind!=="manual")a.setState("error");updatePolarUI()}}
async function polarConnect(id){try{POLAR.error=null;await POLAR.adapter.connect(id)}catch(e){POLAR.error="Connexion impossible : "+e.message;POLAR.adapter.setState("error")}}
async function polarStop(){
  const a=POLAR.adapter;try{const rec=await a.stopSession();if(!rec)return;S.hr.push(rec);save();Notify.scheduleRpe("rpe-hr-"+rec.id,rec.end+18e5,"séance");openLinkHr(rec)}catch(e){POLAR.error="Arrêt impossible : "+e.message+" Les données déjà reçues sont conservées.";updatePolarUI()}}
async function polarSync(){try{const recs=await POLAR.adapter.fetchOfflineRecordings();recs.forEach(r=>S.hr.push(r));save();render();toast(recs.length?recs.length+" séance(s) récupérée(s) depuis la ceinture":"Aucune séance enregistrée dans la ceinture")}catch(e){POLAR.error="Synchronisation impossible : "+e.message;updatePolarUI()}}
function saveHrManual(){
  const d=val("hrDate")||todayISO(),dur=num(val("hrDur"),1,300),avg=num(val("hrAvgIn"),30,230),mx=num(val("hrMaxIn"),30,240);
  if(!isNum(dur)||!isNum(avg)){toast("Indique au moins la durée et la FC moyenne");return}
  const zm=readZones("hrZ",1);const start=dtMs(d,"12:00");
  const rec={id:uid("hr"),start,end:start+dur*60000,durMin:dur,avg,max:isNum(mx)?mx:null,zones:zm?zm.map(z=>isNum(z)?z*60:0):null,curve:[],source:"saisie manuelle (résumé Polar)",device:null,rrCount:0,linked:null};
  S.hr.push(rec);save();openLinkHr(rec);
}
function importHrFile(file){
  const msg=document.getElementById("hrImportMsg");const r=new FileReader();
  r.onload=()=>{try{const txt=String(r.result);const p=/<TrainingCenterDatabase/i.test(txt)?parseTCX(txt):parsePolarCSV(txt);
      if(!p.samples.length)throw new Error("aucune fréquence cardiaque trouvée");
      const rec=summarizeHR(p.samples,{start:p.start,end:p.start+(p.samples[p.samples.length-1][0]+1)*1000,source:"import "+p.kind,device:null});S.hr.push(rec);save();
      if(msg)msg.innerHTML=`Fichier importé : ${fmt(rec.durMin)} min, FC moy ${rec.avg}, max ${rec.max}.`+(p.hrMaxProfile&&!S.settings.hrMax?` <button class="btn ghost small" data-act="useProfileHrMax" data-v="${p.hrMaxProfile}">Utiliser la FC max de ton profil Polar (${p.hrMaxProfile} bpm)</button>`:"");
      if(p.hrMaxProfile)POLAR.profileHrMax=p.hrMaxProfile;
      openLinkHr(rec);
    }catch(e){if(msg)msg.textContent="Import impossible : "+e.message+". Essaie l'export TCX depuis Polar Flow."}};
  r.readAsText(file);
}
document.addEventListener("click",ev=>{const b=ev.target.closest('[data-act="useProfileHrMax"]');if(!b)return;S.settings.hrMax=+b.dataset.v;S.settings.hrMaxSource="Polar (profil)";S.settings.hrMaxDate=todayISO();save();render();toast("FC max du profil Polar enregistrée")});
function parseTCX(txt){
  const doc=new DOMParser().parseFromString(txt,"application/xml");const tps=[...doc.getElementsByTagName("Trackpoint")];
  let start=null;const samples=[];
  tps.forEach(tp=>{const t=tp.getElementsByTagName("Time")[0],h=tp.getElementsByTagName("HeartRateBpm")[0];if(!t||!h)return;const v=h.getElementsByTagName("Value")[0];const ms=Date.parse(t.textContent);const hr=+(v&&v.textContent);if(!isFinite(ms)||!hr)return;if(start==null)start=ms;samples.push([Math.round((ms-start)/1000),hr])});
  return{kind:"TCX",start:start||nowMs(),samples};
}
/* Export CSV de Polar Flow : format reconnu au mieux (non vérifié sur un vrai fichier) */
function parsePolarCSV(txt){
  const lines=txt.split(/\r?\n/).map(l=>l.split(","));let hi=-1;
  for(let i=0;i<lines.length;i++){const c=lines[i].map(x=>x.trim());if(c.includes("Time")&&c.some(x=>/^HR/i.test(x))){hi=i;break}}
  if(hi<0)throw new Error("colonnes « Time » et « HR (bpm) » introuvables");
  const cols=lines[hi].map(x=>x.trim());const ti=cols.indexOf("Time"),hiCol=cols.findIndex(x=>/^HR/i.test(x));
  const samples=[];for(let i=hi+1;i<lines.length;i++){const r=lines[i];if(!r[ti])continue;const p=r[ti].split(":").map(Number);const sec=p.length===3?p[0]*3600+p[1]*60+p[2]:NaN;const hr=+r[hiCol];if(isFinite(sec)&&hr>30)samples.push([sec,hr])}
  let start=nowMs(),hrMaxProfile=null;const h0=lines[0].map(x=>x.trim());
  if(lines[1]){const di=h0.indexOf("Date"),si=h0.indexOf("Start time"),mi=h0.indexOf("HR max");
    if(di>=0&&lines[1][di]){const dp=lines[1][di].split(/[-./]/);const t=(si>=0&&lines[1][si])||"12:00:00";const d=dp[0].length===4?dp.join("-"):dp.reverse().join("-");const ms=Date.parse(d+"T"+t);if(isFinite(ms))start=ms}
    if(mi>=0&&+lines[1][mi]>120)hrMaxProfile=+lines[1][mi]}
  return{kind:"CSV",start,samples,hrMaxProfile};
}

let pressTimer=null,pressStart=null,drag=null,suppressClick=false;
document.addEventListener("pointerdown",ev=>{
  const chip=ev.target.closest(".ev.sess");if(!chip||TAB!=="cal")return;
  if(reorg){ev.preventDefault();startDrag(chip,ev);return}
  pressStart={x:ev.clientX,y:ev.clientY,chip};
  if(!matchMedia("(prefers-reduced-motion: reduce)").matches){chip.style.transition="transform 2s linear";chip.style.transform="scale(1.1)"}
  pressStart.last=ev;
  pressTimer=setTimeout(()=>{pressTimer=null;const p=pressStart;pressStart=null;if(!p)return;Native.haptic("medium");suppressClick=true;chip.style.transform="";chip.style.transition="";
    startDrag(chip,p.last);markCompatible(chip.dataset.sid)},2000);
});
function cancelPress(){if(pressTimer){clearTimeout(pressTimer);pressTimer=null}if(pressStart&&pressStart.chip){pressStart.chip.style.transform="";pressStart.chip.style.transition=""}pressStart=null}
document.addEventListener("pointermove",ev=>{
  if(pressStart){pressStart.last=ev;if(Math.hypot(ev.clientX-pressStart.x,ev.clientY-pressStart.y)>10)cancelPress()}
  if(!drag)return;ev.preventDefault();drag.ghost.style.left=ev.clientX+"px";drag.ghost.style.top=ev.clientY+"px";
  document.querySelectorAll(".drop,.dragover").forEach(e=>e.classList.remove("drop","dragover"));
  const el=document.elementFromPoint(ev.clientX,ev.clientY);if(!el){drag.target=null;return}
  const c=el.closest(".ev.sess");if(c&&c.dataset.sid!==drag.id){c.classList.add("dragover");drag.target={swap:c.dataset.sid};return}
  const cell=el.closest(".cell");if(cell){cell.classList.add("drop");drag.target={date:cell.dataset.date}}else drag.target=null;
},{passive:false});
document.addEventListener("pointerup",()=>{cancelPress();if(drag)endDrag()});
document.addEventListener("pointercancel",()=>{cancelPress();if(drag){drag.ghost.remove();drag=null;render()}});
document.addEventListener("contextmenu",ev=>{if(ev.target.closest(".ev"))ev.preventDefault()});
/* Jours compatibles : aucun match ni séance déjà prévue, pas la veille d'un match (affichage indicatif, l'analyse vient au dépôt) */
function markCompatible(id){const s=sessionById(id);const m=new Set(clubEvents().filter(e=>e.kind==="match").map(e=>e.date));const busy=new Set(sessions().filter(x=>x.id!==id&&!isOpt(x)).map(x=>x.date));
  document.querySelectorAll(".cell[data-date]").forEach(c=>{const d=c.dataset.date;if(d<todayISO())return;const nx=iso(new Date(new Date(d+"T12:00").getTime()+864e5));if(!m.has(d)&&!busy.has(d)&&!m.has(nx))c.classList.add("ok-day")})}
function startDrag(chip,ev){const id=chip.dataset.sid;const g=document.createElement("div");g.className="drag-ghost";g.textContent=tpl(sessionById(id)).name;g.style.left=ev.clientX+"px";g.style.top=ev.clientY+"px";document.body.appendChild(g);drag={id,ghost:g,target:null};chip.style.opacity=".35"}
function endDrag(){
  const d=drag;drag=null;d.ghost.remove();document.querySelectorAll(".drop,.dragover,.ok-day").forEach(e=>e.classList.remove("drop","dragover","ok-day"));suppressClick=true;setTimeout(()=>suppressClick=false,350);
  const s=sessionById(d.id);if(!d.target){render();return}
  openId=d.id;
  if(d.target.swap){const o=sessionById(d.target.swap);openSheet(sheetVerdict(d.id,o.date,o.id),"Analyse du déplacement");return}
  if(d.target.date&&d.target.date!==s.date){const occ=sessions().find(x=>x.id!==d.id&&x.date===d.target.date&&!isOpt(x));openSheet(sheetVerdict(d.id,d.target.date,occ?occ.id:null),"Analyse du déplacement");return}
  render();
}
