const exRowFromX=e=>({n:e.n,sets:e.sets,reps:e.reps,rir:e.rir,rest:e.rest,cat:e.cat,cue:e.cue,alt:e.alt,lift:e.lift,pct:e.pct,ss:e.ss,tempo:e.tempo,z:e.z,check:!!e.check});
function legacyProgramSnapshot(){
  const slots=baseSlotsFor(BASE_CLUB);
  const mkSess=x=>{const T=TYPES[x.defaultCode];const wu=T.wu?WU[T.wu]:null;const cd=cdOf(T);
      return{id:"ls-"+x.id,code:x.defaultCode,day:(diff(mondayOf(x.date),x.date)),time:x.timeLabel,name:T.name,short:T.short,goal:T.goal,dur:T.dur,int:T.int,rpe:T.rpe,fam:T.fam,optional:!!x.optional,
        wu:wu?deep(wu.items):[],wuMin:wu?wu.min:0,cd:deep(cd.items),cdMin:cd.min,main:T.fn({lvl:x.lvl,date:x.date}).map(exRowFromX)}};
  /* Une semaine de programme = 7 jours ; la trêve (11 jours) occupe donc deux semaines */
  const mkWeek=w=>{const lab=WTYPE[w.type]+" · "+LVL[weekLevelFrom(BASE_CLUB.filter(e=>e.kind==="match"),w)];const own=slots.filter(x=>x.week===w.n);
    const mons=[...new Set(own.map(x=>mondayOf(x.date)))].sort();if(!mons.length)mons.push(w.s);
    return mons.map((m,i)=>({id:"lw-"+w.n+(i?"-"+i:""),label:lab+(i?" (suite)":""),note:"",sessions:own.filter(x=>mondayOf(x.date)===m).map(mkSess)}))};
  return{id:LUCAS.programId,name:"Programme historique · Lucas (oct.–déc. 2026)",description:"Programme personnel migré de la version précédente. Ses séances sont recalculées par le moteur historique selon les matchs réels, les entraînements à Caen et les semaines d'alternance ou de cours.",
    goal:"Force maximale et force horizontale en saison, fraîcheur pour les matchs",sport:"football",level:"competition",createdAt:"2026-10-12T00:00:00.000Z",createdBy:"coach",updatedAt:nowISO(),status:"active",version:1,
    rules:{...DEFAULT_RULES},engine:LUCAS.ctx,legacy:true,
    blocks:[{id:"lb-saison",name:"Bloc en saison",goal:"Force et force horizontale, fraîcheur pour les matchs",weeks:WEEKS_LUCAS.filter(w=>w.type!=="treve").flatMap(mkWeek)},
            {id:"lb-treve",name:"Trêve",goal:"Récupération active",weeks:WEEKS_LUCAS.filter(w=>w.type==="treve").flatMap(mkWeek)}]}}

/* ---------- Estimation de durée (temps d'exécution + repos + transitions) ----------
   Utilisée dans l'éditeur du coach et pour la revue des volumes. Hypothèses affichées : ≈ 3,5 s par répétition
   (5 s avec tempo lent, 2 s pour les sauts), 45 s de transition entre exercices. */
function estimateMain(rows){let t=0;rows.forEach(e=>{const sets=parseInt(e.sets)||1;const r=String(e.reps||"");
  let work;let m=r.match(/(\d+)\s*min/);if(m)work=+m[1]*60;else if((m=r.match(/(\d+)\s*s\b/)))work=+m[1]*(/côté|jambe|bras/.test(r)?2:1);else if(/\d+\s*m\b/.test(r))work=12;
  else{m=r.match(/(\d+)(?:-(\d+))?/);const n=m?(m[2]?(+m[1]+ +m[2])/2:+m[1]):5;work=n*(e.plyo||e.check?2:e.tempo?5:3.5)*(/côté|jambe|bras/.test(r)?2:1)}
  const rest=restSecs(e.rest)||(String(e.rest||"").trim().startsWith("—")?0:60);t+=sets*work+Math.max(0,sets-1)*rest+(e.ss&&/1$/.test(e.ss)?0:45)});return Math.round(t/60)}
function estimatePs(ps){return(+ps.wuMin||0)+estimateMain((ps.main||[]).map(r=>({...r,plyo:exLib(r.n).plyo})))+(+ps.cdMin||0)}

function oneRMs(){
  const t=latestTests(),bw=+(t.bw||S.settings.bw);const r={bw,src:{}};
  if(isNum(t.squat3)){r.squat=brz(+t.squat3,3);r.src.squat=t.squat3+" kg × 3"}
  if(isNum(t.bench3)){r.bench=brz(+t.bench3,3);r.src.bench=t.bench3+" kg × 3"}
  if(isNum(t.dl3)){r.dl=brz(+t.dl3,3);r.src.dl=t.dl3+" kg × 3"}
  if(isNum(t.rdlRefW)&&isNum(t.rdlRefR)&&+t.rdlRefR<=10){r.rdl=brz(+t.rdlRefW,+t.rdlRefR);r.src.rdl=t.rdlRefW+" kg × "+t.rdlRefR}
  if(isNum(t.pullLoad3)&&+t.pullLoad3>0){r.pull=brz(bw+(+t.pullLoad3),3);r.src.pull="+"+t.pullLoad3+" kg × 3"}
  if(isNum(t.pullReps))r.pullReps=+t.pullReps;
  if(isNum(S.settings.dmRefW))r.dm=brz(+S.settings.dmRefW,Math.min(10,+S.settings.dmRefR||8));

/* Texte de charge d'un exercice : pourcentage + kilogrammes, ou consigne au RIR quand aucune référence fiable n'existe */
function loadInfo(e){
  if(e.presc){const P=prescLoad(e.presc);if(!P)return null;
    return{pct:P.pct?P.pct+" % du 1RM estimé":null,kg:P.kg!=null?P.text:null,kgNum:P.kg,note:P.kg==null?P.text:null,formula:P.formula,missing:!!P.missing,
      help:P.missing?(P.why||"")+(P.fallback?" · En attendant : "+P.fallback.text+".":"")+" Ton coach peut te faire passer le test.":P.locked?"Calcul automatique des charges non inclus dans ta formule.":(P.formula||""),adj:""}}
  if(!e.lift)return null;
  if(!can("auto_loads"))return{pct:null,kg:null,note:"Charge au ressenti ("+(e.rir||"RIR 2")+")",help:"Calcul automatique des charges non inclus dans ta formule."};
  const r=oneRMs(),adj=+(S.loadAdj[e.lift]||0),adjTxt=adj?" (progression "+(adj>0?"+":"")+fmt(adj)+" kg)":"";
  const pct=e.pct?Math.round(e.pct*100)+" % du 1RM estimé":null;
  if(e.lift==="rdl"){
    if(!r.rdl)return{pct:null,kg:null,note:"Charge à ajuster au RIR 2",help:"Pas encore de référence au roumain : ton test du 12/10 est un soulevé de terre classique. Ajoute une référence dans Programme › Tests."};
    const p={5:.78,6:.75,8:.68}[parseInt(e.reps,10)]||.72;const kgN=roundTo(r.rdl*p+adj,S.settings.barInc);
    return{pct:Math.round(p*100)+" % du 1RM estimé au roumain",kg:fmt(kgN)+" kg",kgNum:kgN,note:null,adj:adjTxt};
  }
  if(e.lift==="pull"){
    if(!r.pull)return{pct:null,kg:null,note:"Poids du corps · "+e.repsBW+" reps",help:(r.pullReps?"Base : "+r.pullReps+" reps au poids du corps le 12/10. ":"")+"Sans 3RM lesté, aucun lest n'est calculé : un calcul à partir de "+(r.pullReps||"11")+" reps ne serait pas fiable."};
    const lest=roundTo(e.pct*r.pull-r.bw+adj,S.settings.barInc);
    return{pct,kg:lest>0?"+ "+fmt(lest)+" kg de lest":"Poids du corps",note:null,adj:adjTxt};
  }
  if(!r[e.lift])return{pct,kg:null,note:"Charge à calculer",help:"Saisis le test correspondant dans Programme › Tests."};
  const inc=e.perHand?S.settings.dbInc:S.settings.barInc;
  return{pct,kg:fmt(roundTo(e.pct*r[e.lift]+adj,inc))+" kg"+(e.perHand?" par haltère":""),kgNum:roundTo(e.pct*r[e.lift]+adj,inc),note:null,adj:adjTxt};
}
/* Tonnage prévu (charge externe) : séries × répétitions × kg, seulement pour les exercices chiffrés */
function tonnage(items){let t=0;items.forEach(e=>{if(e.removed||e.lift==="pull")return;const L=loadInfo(e);if(!L||L.kgNum==null)return;const reps=parseInt(e.reps,10);if(typeof e.sets==="number"&&reps)t+=e.sets*reps*L.kgNum*(e.perHand?2:1)});return Math.round(t)}

/* =====================================================================

   {mode, ref, pct, round, min, max, value, target, fallback}
   Modes : fixed (charge fixe), pct1rm (% du 1RM estimé), pctTest (% de la valeur d'un test),
   bw (poids du corps), bwPlus (poids du corps + lest), rpe (RPE cible), rir (RIR cible),
   time (durée), distance, reps (répétitions seules), free (charge libre choisie par l'athlète).
   Règle absolue : sans test compatible, AUCUNE charge n'est inventée → « Test requis pour calculer cette charge ».
   Estimation du 1RM : Brzycki = charge × 36 / (37 − répétitions) (déjà utilisée en v9), ou Epley = charge × (1 + répétitions / 30).
   Ces formules viennent de la littérature (Brzycki 1993, Epley 1985), pas des cours fournis : elles sont affichées

    const r=ref==="pull"?(()=>{const bw=lastTest("bw",before);return t&&bw?{v:FORMULAS.brzycki.f(bw.value+t.value,3),src:`(${fmt(bw.value)} kg de corps + ${fmt(t.value)} kg de lest) × 3, ${FORMULAS.brzycki.l}`,date:t.date}:null})()

function prescLoad(pr,opts={}){
  if(!isObj(pr)||!pr.mode)return null;const inc=+pr.round||+S.settings.barInc||2.5;const before=opts.before;
  const clamp=v=>{let x=v;if(isNum(pr.min))x=Math.max(x,+pr.min);if(isNum(pr.max))x=Math.min(x,+pr.max);return x};
  const missing=why=>{const fb=pr.fallback;return{kg:null,text:"Test requis pour calculer cette charge",missing:true,why,fallback:fb?prescLoad({mode:fb.mode||"rir",target:fb.target,value:fb.value},opts):null}};
  switch(pr.mode){
    case "fixed":return isNum(pr.value)?{kg:+pr.value,text:fmt(+pr.value)+" kg",formula:"Charge fixe choisie par le coach"}:{kg:null,text:"Charge à préciser par le coach",missing:true};
    case "pct1rm":case "pctTest":{
      if(!can("auto_loads"))return{kg:null,text:"Charge au ressenti"+(pr.fallback&&pr.fallback.target?" ("+pr.fallback.target+")":""),locked:"auto_loads"};
      if(!isNum(pr.pct)||!pr.ref)return missing("Pourcentage ou référence non renseignés");
      let base=null,src="";
      if(pr.mode==="pct1rm"){const e=est1RM(pr.ref,before);if(!e)return missing("Aucun test pour « "+refLabel(pr.ref)+" »");base=e.v;src="1RM estimé "+fmt(e.v)+" kg = "+e.src}
      else{const t=lastTest(REF_TEST_KEY[pr.ref]||pr.ref,before);if(!t)return missing("Aucun résultat pour le test « "+refLabel(pr.ref)+" »");base=t.value;src=refLabel(pr.ref)+" : "+fmt(t.value)+" (test du "+fmtShort(t.date)+")"}
      const kg=clamp(roundLoad(base*(+pr.pct)/100,inc));
      return{kg,text:fmt(kg)+" kg",pct:+pr.pct,formula:`${pr.pct} % × ${src} → ${fmt(base*(+pr.pct)/100)} kg, arrondi à ${fmt(inc)} kg${isNum(pr.min)||isNum(pr.max)?" (bornes "+(isNum(pr.min)?fmt(pr.min):"—")+" / "+(isNum(pr.max)?fmt(pr.max):"—")+" kg)":""}`}}
    case "bw":return{kg:null,text:"Poids du corps",formula:"Sans charge additionnelle"};
    case "bwPlus":return isNum(pr.value)?{kg:+pr.value,text:"Poids du corps + "+fmt(+pr.value)+" kg",formula:"Lest fixe"}:{kg:null,text:"Poids du corps + lest à préciser",missing:true};
    case "rpe":return{kg:null,text:"RPE cible "+(pr.target||"—"),formula:"Charge choisie pour atteindre le RPE indiqué"};
    case "rir":return{kg:null,text:(String(pr.target||"").match(/^RIR/i)?pr.target:"RIR "+(pr.target||"—")),formula:"Charge choisie pour garder ces répétitions en réserve"};
    case "time":return{kg:null,text:"Durée : "+(pr.target||"—")};
    case "distance":return{kg:null,text:"Distance : "+(pr.target||"—")};
    case "reps":return{kg:null,text:"Répétitions uniquement"};
    case "free":return{kg:null,text:"Charge libre : choisis-la et note-la"};
  }return null}
const refLabel=k=>(REF_STD.find(x=>x[0]===k)||[k,(testType(k)||{}).name||k])[1];
/* Texte de charge unifié pour une ligne d'exercice (programme générique ou historique) */
function loadView(e,s){
  const frozen=s&&S.log[s.id]&&S.log[s.id].loads&&S.log[s.id].loads[e.n];
  if(frozen)return{...frozen,frozen:true};

/* Charges figées à la réalisation : une nouvelle valeur de test ne réécrit jamais l'historique */
function freezeLoads(){let ch=false;
  Object.entries(S.status||{}).forEach(([id,st])=>{if(!st||!["done","adapted"].includes(st.s))return;const l=S.log[id]=S.log[id]||{};if(l.loads)return;
    const s=typeof sessionById==="function"?sessionById(id):null;if(!s)return;let items=[];try{items=sessionItems(s)}catch(e){return}
    const out={};items.forEach(e=>{if(e.removed)return;let L=null;try{L=e.presc?prescLoad(e.presc,{before:s.date}):(e.lift?loadInfo(e):null)}catch(_){}
      if(L&&(L.kg!=null||L.text||L.kgNum!=null))out[e.n]={text:L.text||L.kg&&String(L.kg)||"",kg:L.kg??L.kgNum??null,formula:L.formula||L.pct||"",at:nowISO()}});
    l.loads=out;ch=true});
  return ch}
/* Contrôles de l'éditeur : tests manquants pour un client */
function missingTestsFor(prog,clientId){const need=new Set();progSessions(prog).forEach(x=>(x.ps.main||[]).forEach(r=>{if(r.presc&&["pct1rm","pctTest"].includes(r.presc.mode)&&r.presc.ref)need.add(r.presc.ref)}));

/* =====================================================================
   MODULE 7 · QUANTIFICATION DE LA CHARGE
   Charge interne sRPE = durée réelle (min) × RPE (0-10), noté environ 30 min après (Foster, cours Quantification).
   Séparé : prévue / réelle · interne (sRPE) / externe (FC, tonnage) / mécanique estimée (indicateurs manuels).
   Ne sont jamais comptées dans la charge réelle : séances non réalisées, annulées, fatigue, non renseignées.
   ===================================================================== */
const RPE_LABELS=["Repos","Très, très facile","Facile","Modéré","Un peu difficile","Difficile","Difficile +","Très difficile","Très difficile +","Presque maximal","Maximal"];
const FLAGS=[["sprints","Beaucoup de sprints courts"],["accel","Beaucoup d'accélérations"],["cod","Beaucoup de freinages ou changements de direction"],["duels","Beaucoup de duels ou contacts"],["sauts","Beaucoup de sauts"],["lourdes","Jambes lourdes"],["douleur","Douleur inhabituelle"]];
const FLAG_LABEL=Object.fromEntries(FLAGS);
const srpe=a=>a&&isNum(a.dur)&&isNum(a.rpe)?Math.round(+a.dur*+a.rpe):null;
const plannedLoadOfSession=s=>{const T=tpl(s);return T.dur*T.rpe};
function realEntries(){return memo("real",()=>{
  const out=[];
  activeClub().forEach(e=>{const a=e.actual;const v=srpe(a);if(v!=null)out.push({date:e.date,kind:e.kind,id:e.id,srpe:v,rpe:+a.rpe,dur:+a.dur,hrAvg:a.hrAvg,hrMax:a.hrMax,flags:a.flags||[],key:refKey(e),pos:a.pos,minutes:a.minutes})});
  sessions().forEach(s=>{const st=statusOf(s);if(st!=="done"&&st!=="adapted")return;const l=S.log[s.id];const v=srpe(l);if(v!=null)out.push({date:s.date,kind:"muscu",id:s.id,srpe:v,rpe:+l.rpe,dur:+l.dur,hrAvg:l.hrAvg,hrMax:l.hrMax,flags:[],key:"muscu-"+effCode(s)})});
  otherList().forEach(o=>{const v=srpe(o);if(v!=null)out.push({date:o.date,kind:"autre",id:o.id,srpe:v,rpe:+o.rpe,dur:+o.dur,flags:[],key:"autre-"+o.sport})});
  return out;
})}
function dayLoad(date){
  let planned=0,real=0;
  sessions().filter(s=>s.date===date&&!isOpt(s)).forEach(s=>planned+=plannedLoadOfSession(s));
  activeClub().filter(e=>e.date===date).forEach(e=>planned+=(+e.dur||0)*(+e.plannedRPE||0));
  realEntries().filter(r=>r.date===date).forEach(r=>real+=r.srpe);
  return{planned,real};
}
function weekLoad(w){
  const end=w.type==="treve"?PERIOD_END:addDays(w.s,6);let planned=0,real=0,done=0,total=0;const flags={};const hr=[];
  for(let d=w.s;d<=end;d=addDays(d,1)){const l=dayLoad(d);planned+=l.planned;real+=l.real}
  activeClub().filter(e=>e.date>=w.s&&e.date<=end).forEach(e=>{total++;if(srpe(e.actual)!=null)done++;(e.actual&&e.actual.flags||[]).forEach(f=>flags[f]=(flags[f]||0)+1);if(e.actual&&isNum(e.actual.hrAvg))hr.push(+e.actual.hrAvg)});
  sessions().filter(s=>s.date>=w.s&&s.date<=end&&!isOpt(s)).forEach(s=>{total++;if(srpe(S.log[s.id])!=null&&(statusOf(s)==="done"||statusOf(s)==="adapted"))done++});
  let ton=0;sessions().filter(s=>s.date>=w.s&&s.date<=end&&(statusOf(s)==="done"||statusOf(s)==="adapted")).forEach(s=>ton+=tonnage(sessionItems(s)));
  return{planned,real,done,total,flags,hrAvg:hr.length?Math.round(hr.reduce((a,b)=>a+b,0)/hr.length):null,ton};
}
/* Ratio charge aiguë / chronique : indicateur de TENDANCE uniquement (jamais un diagnostic).
   Aiguë = 7 derniers jours ; chronique = moyenne hebdomadaire des 28 derniers jours. Il faut 28 jours de données. */
function acwr(date,kind){
  const first=kind==="real"?(realEntries().map(r=>r.date).sort()[0]||null):PERIOD_START;
  if(!first||diff(first,date)<27)return{ratio:null,days:first?Math.max(0,diff(first,date)+1):0};
  let a=0,c=0;for(let i=0;i<7;i++)a+=dayLoad(addDays(date,-i))[kind];
  for(let i=0;i<28;i++)c+=dayLoad(addDays(date,-i))[kind];c=c/4;
  return{ratio:c>0?a/c:null,days:28,acute:a,chronic:c};
}
/* Références personnelles : même type de séance, même jour (ex. tes mercredis entre eux), matchs entre eux */
const REF_MIN=4;
function refKey(e){if(e.kind==="match")return "match";return "club-"+JOURS_C[D(e.date).getDay()]}
const REF_NAME=k=>k==="match"?"Matchs":k.startsWith("autre-")?"Autre · "+((SPORTS[k.slice(6)]||SPORTS.autre).name):k.startsWith("club-")?"Club · "+cap({lun:"lundis",mar:"mardis",mer:"mercredis",jeu:"jeudis",ven:"vendredis",sam:"samedis",dim:"dimanches"}[k.slice(5)]):"Muscu · "+(TYPES[k.slice(6)]?TYPES[k.slice(6)].name:k);
function refStats(excludeId){
  const g={};realEntries().forEach(r=>{if(r.id===excludeId)return;(g[r.key]=g[r.key]||[]).push(r)});
  const out={};Object.entries(g).forEach(([k,arr])=>{const v=arr.map(r=>r.srpe);const m=v.reduce((a,b)=>a+b,0)/v.length;const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/Math.max(1,v.length-1));const hrs=arr.filter(r=>isNum(r.hrAvg)).map(r=>+r.hrAvg);out[k]={n:arr.length,mean:m,sd,hr:hrs.length?hrs.reduce((a,b)=>a+b,0)/hrs.length:null,rpe:arr.reduce((a,r)=>a+r.rpe,0)/arr.length}});
  return out;
}
/* Classement d'une séance réelle : référence personnelle si au moins 4 séances comparables, sinon seuil provisoire (RPE ≥ 7) */
function classifyLoad(e){
  const a=e.actual;const v=srpe(a);if(v==null)return null;
  const st=refStats(e.id)[refKey(e)];
  if(st&&st.n>=REF_MIN){const lim=st.mean+Math.max(st.sd,.1*st.mean);return{high:v>lim,provisional:false,text:"RPE "+a.rpe+" · "+v+" UA, ta moyenne de "+REF_NAME(refKey(e)).toLowerCase()+" : "+Math.round(st.mean)+" UA (n = "+st.n+")"}}
  return{high:+a.rpe>=7,provisional:true,text:"RPE "+a.rpe+" · "+v+" UA (seuil provisoire : RPE 7 ou plus)"};
}
/* FC : interprétable seulement avec une FC max mesurée. Seuil « élevée » : moyenne ≥ 85 % FC max
   (le cours Méthodes cardiovasculaires situe SV1 vers 80-85 % FC max). Pour un défenseur central, une FC moyenne modérée ne signifie pas une charge faible. */
function classifyHR(a){
  const hm=+S.settings.hrMax;if(!a||!isNum(a.hrAvg))return{level:null,text:"FC non renseignée"};
  if(!hm)return{level:null,text:"FC moy "+a.hrAvg+" bpm (non interprétée : FC max non renseignée)"};
  const p=a.hrAvg/hm;return{level:p>=.85?"high":p>=.8?"mid":"mod",pct:p,text:"FC moy "+a.hrAvg+" bpm ("+Math.round(p*100)+" % de ta FC max)"};
}
/* Zones par défaut de Polar (% FC max) : convention du fabricant, pas une règle du cours. Modifiables plus tard. */
const ZONES=[[.5,.6],[.6,.7],[.7,.8],[.8,.9],[.9,1.01]];
const zoneOf=(hr,hm)=>{if(!hm)return null;const p=hr/hm;for(let i=ZONES.length-1;i>=0;i--)if(p>=ZONES[i][0])return i;return -1};

/* =====================================================================
   MODULE 8 · FATIGUE (questionnaire de ressenti)
   ===================================================================== */
/* Questionnaire de bien-être quotidien (à remplir le matin, avant la séance).
   5 items du cours Planification « questionnaires de bien-être : sommeil, fatigue, douleurs, humeur, stress ».
   Curseur 0-100 (100 = meilleur état). Les 4 items de l'indice de Hooper (sommeil, fatigue, stress, douleurs musculaires,
   cours Quantification de la charge) sont aussi convertis en 1-7 (7 = pire) pour un indice sur 28. L'humeur (inspirée du POMS) n'entre pas dans Hooper. */
const WB_ITEMS=[
 {k:"sommeil",n:"Qualité du sommeil",lo:"Très mauvaise",hi:"Excellente",hooper:true},
 {k:"fraicheur",n:"Fraîcheur / fatigue",lo:"Épuisé",hi:"Très frais",hooper:true},
 {k:"courbatures",n:"Courbatures",lo:"Très fortes",hi:"Aucune",hooper:true},
 {k:"stress",n:"Stress",lo:"Très stressé",hi:"Détendu",hooper:true},
 {k:"humeur",n:"Humeur / motivation",lo:"Au plus bas",hi:"Au top",hooper:false}];
const hooperItem=v=>1+Math.round((100-v)/100*6);
function wbCompute(items){
  const vals=WB_ITEMS.map(i=>items[i.k]).filter(isNum);
  if(vals.length<WB_ITEMS.length)return null;
  return{score:Math.round(vals.reduce((a,b)=>a+(+b),0)/vals.length),hooper:WB_ITEMS.filter(i=>i.hooper).reduce((a,i)=>a+hooperItem(+items[i.k]),0)};
}
const wbLabel=sc=>sc>=75?"Bien":sc>=60?"Correct":sc>=45?"Moyen":"Faible";
const WB_LOW=25; // item « signalé » : curseur dans le quart le plus bas (≈ 6 ou 7 sur l'échelle de Hooper)
function fatigueEval(date){
  const f=S.fatigue[date];if(!f)return null;
  const prev=Object.keys(S.fatigue).filter(d=>d<date&&diff(d,date)<=14&&isNum(S.fatigue[d].score)).map(d=>+S.fatigue[d].score);
  const base=prev.length>=5?prev.reduce((a,b)=>a+b,0)/prev.length:null;
  const reasons=[],signs=[];let high=false;
  if(isNum(f.score)){const sc=+f.score;
    if(base!=null&&sc<=base-S.settings.fatDrop){high=true;signs.push("score");reasons.push("Score de bien-être "+sc+"/100, soit "+Math.round(base-sc)+" points sous ta moyenne des 14 derniers jours ("+Math.round(base)+").")}
    else if(base==null&&sc<S.settings.fatAbs){high=true;signs.push("score");reasons.push("Score de bien-être "+sc+"/100, sous le seuil provisoire de "+S.settings.fatAbs+" (ta moyenne personnelle sera utilisée après 5 questionnaires).")}}
  const items=f.items||{};const low=WB_ITEMS.filter(i=>isNum(items[i.k])&&+items[i.k]<=WB_LOW);
  if(low.length){signs.push(...low.map(i=>i.k));reasons.push("Item(s) très bas : "+low.map(i=>i.n.toLowerCase()).join(", ")+".")}
  // Courbatures basses 3 jours de suite = « courbatures > 72 h » (signe de surmenage du cours Pliométrie)
  const sore=d=>{const x=S.fatigue[d];return x&&x.items&&isNum(x.items.courbatures)&&+x.items.courbatures<=40};
  if(sore(date)&&sore(addDays(date,-1))&&sore(addDays(date,-2))){high=true;signs.push("courbatures72");reasons.push("Courbatures marquées depuis au moins 3 jours (plus de 72 h).")}
  const r=oneRMs();
  if(isNum(f.cmj)&&r.cmj&&+f.cmj<r.cmj*.95){high=true;signs.push("cmj");reasons.push("CMJ du jour "+fmt(+f.cmj)+" cm, soit "+Math.round((1-f.cmj/r.cmj)*100)+" % sous ton test ("+fmt(r.cmj)+" cm). Le cours Pliométrie cite une baisse de plus de 5 % comme signe de fatigue.")}
  const fl=f.factors||[];const names={sommeil:"sommeil",stress:"stress",fatigue:"fatigue générale",courbatures:"courbatures"};
  const flagged=fl.filter(x=>names[x]).map(x=>names[x]);
  if(flagged.length)reasons.push("Facteur signalé : "+flagged.join(", ")+".");
  if(low.length>=2)high=true;
  const multi=new Set(signs).size>=2;
  return{high,reasons,pain:fl.includes("douleur")||!!f.pain,score:f.score,hooper:f.hooper,flagged:[...flagged,...low.map(i=>i.n.toLowerCase())],multi,src:f.src||"manuel",at:f.at,base};
}

/* =====================================================================
   MODULE 9 · ADAPTATION DE LA MUSCULATION
   Analyse les 72 h précédentes (club, matchs, muscu) + bien-être + séances à venir.
   Ne modifie jamais rien sans confirmation : renvoie une proposition expliquée.
   ===================================================================== */
function recommendRaw(s){
  const T=tpl(s),date=s.date,ctx=matchCtx(date);
  const trig=[],targets=new Set(),notes=[];let phys=false,mech=false,pain=false,fat=false,provisional=false,highLoads=0;
  const lowerSession=T.fam==="heavy"||T.fam==="power";
  const recent=activeClub().filter(e=>{const g=diff(e.date,date);return g>=1&&g<=3});
  recent.forEach(e=>{
    const a=e.actual,lbl=(e.kind==="match"?"Match":"Club")+" "+fmtShort(e.date);
    if(!a||srpe(a)==null){if(diff(e.date,date)===1&&e.kind==="training")notes.push("La séance club de la veille ("+fmtShort(e.date)+") n'est pas renseignée : la proposition se base sur le plan seulement.");return}
    const cl=classifyLoad(e),hr=classifyHR(a);if(cl.provisional)provisional=true;
    const fl=a.flags||[];
    trig.push(lbl+" : "+cl.text+(isNum(a.hrAvg)?" · "+hr.text:"")+(fl.length?" · "+fl.filter(f=>f!=="douleur").map(f=>FLAG_LABEL[f].toLowerCase()).join(", "):""));
    if(cl.high){highLoads++;if(hr.level==="high")phys=true;else mech=true}
    if(fl.includes("sprints")){targets.add("post");targets.add("sprint")}
    if(fl.includes("accel")){targets.add("post");targets.add("calf")}
    if(fl.includes("cod"))targets.add("quad");
    if(fl.includes("duels")||fl.includes("sauts"))targets.add("plyo");
    if(fl.includes("lourdes"))targets.add("legs");
    if(fl.includes("douleur"))pain=true;
  });
  // Autres activités (padel, vélo…) le jour même ou dans les 2 jours avant : charge du jour + lecture du commentaire
  let otherLeg=false,otherUp=false;const otDays=new Set();
  otherList().forEach(o=>{const g=diff(o.date,date);if(g>=0&&g<=2)otDays.add(o.date)});
  [...otDays].sort().forEach(d=>{const v=otherVerdict(d),sg=dayCommentSignals(d);const names=v.acts.map(o=>sportOf(o).name.toLowerCase()+" "+o.dur+" min × RPE "+o.rpe).join(", ");
    if(otherNeedsProposal(v,sg)){
      trig.push("Autre activité "+fmtShort(d)+" : "+names+(v.ratio!=null?" · 7 jours à "+v.acute.total+" UA pour une charge habituelle de "+v.chronic.weekly+" UA/sem. (ratio "+v.ratio.toFixed(2).replace(".",",")+")":"")+(sg.list.length?" · commentaire : "+sg.list.join(", "):""));
      if(sg.pain)pain=true;
      if(sg.legs){otherLeg=true;targets.add("legs")}
      if(sg.calf){otherLeg=true;targets.add("calf")}
      if(sg.post){otherLeg=true;targets.add("post")}
      if(sg.upper)otherUp=true;
      v.acts.forEach(o=>{const p=sportOf(o);
        if(v.tier===2||sg.tired){if(p.legs>=1){otherLeg=true;if(p.legs>=2)(p.targets||[]).forEach(t=>targets.add(t))}if(p.upper>=1)otherUp=true}});
    }else if(v.tier===1)notes.push("Autre activité "+fmtShort(d)+" ("+names+") : "+(v.ratio!=null&&v.ratio>(+S.settings.otZone||1.2)?"semaine un peu au-dessus de ta charge habituelle (ratio "+v.ratio.toFixed(2).replace(".",",")+")":v.extra.join(", "))+". Recommandation seulement : récupère bien, la séance reste identique.")});
  // Commentaire du questionnaire du jour : douleur ou jambes lourdes signalées
  const sgW=commentSignals((S.fatigue[date]||{}).comment);
  if(sgW.any){if(sgW.pain)pain=true;if(sgW.legs||sgW.calf||sgW.post){otherLeg=true;if(sgW.legs)targets.add("legs");if(sgW.calf)targets.add("calf");if(sgW.post)targets.add("post")}if(sgW.upper)otherUp=true;
    if(sgW.pain||sgW.legs||sgW.calf||sgW.post||sgW.upper)trig.push("Commentaire du questionnaire : "+sgW.list.join(", "))}
  const fe=fatigueEval(date);
  if(fe){if(fe.high){fat=true;fe.reasons.forEach(r=>trig.push("Bien-être : "+r))}if(fe.pain)pain=true}
  if(ctx.label!=="Pas de match proche")trig.push("Contexte : "+ctx.label);
  // Choix de la proposition
  let mode="none",why=[],effect="";
  if(pain){mode="pain";why.push("Une douleur inhabituelle est signalée. L'appli ne pose aucun diagnostic : elle propose d'éviter de charger la zone et de demander l'avis d'un professionnel si la douleur persiste.");effect="Éviter d'ajouter une contrainte sur une zone douloureuse."}
  else if(phys&&fat&&lowerSession){mode=T.fam==="heavy"?"active":"micro";why.push("RPE élevé avec FC élevée (fatigue physiologique importante) et bien-être en baisse.");effect="Favoriser la récupération pour retrouver de la fraîcheur avant les prochaines séances club."}
  else if(phys&&lowerSession){mode="volume";why.push("RPE et FC élevés sur la séance récente : fatigue physiologique importante.");effect="Garder l'intensité mais réduire le volume, comme en affûtage (cours Planification)."}
  else if(fat&&fe.multi&&lowerSession){mode=T.fam==="heavy"?"active":"micro";why.push("Plusieurs signes de fatigue en même temps dans ton questionnaire ou ton CMJ. Le cours Pliométrie (Bompa et Haff) recommande alors de réduire fortement le volume (environ 50 %) ou de passer en récupération active.");effect="Laisser le temps à l'organisme de récupérer avant de recharger."}
  else if(otherLeg&&lowerSession){mode=targets.size?"targeted":"volume";why.push("Ton autre activité ou ton commentaire indiquent que les jambes ont déjà été bien sollicitées (charge de la journée au-dessus du plafond ou fatigue signalée).");effect=targets.size?"Réduire les exercices qui sollicitent les mêmes zones, garder le reste.":"Réduire le volume sans changer l'intensité."}
  else if(otherUp&&T.fam==="upper"){mode="volume";why.push("Ton autre activité ou ton commentaire indiquent que le haut du corps a déjà été bien sollicité.");effect="Réduire le volume du haut du corps sans changer l'intensité."}

  else if(fat){mode=lowerSession?"volume":"none";why.push("Ton bien-être du jour indique une fatigue élevée.");effect=lowerSession?"Réduire le volume de la séance.":"Séance déjà légère : garde-la ou passe en repos selon tes sensations."}

  const changes={none:["Séance conservée telle qu'elle est prévue."],volume:["1 série de moins par exercice","RIR + 1 sur les exercices de force"],power:["Sauts, sprints et lancers supprimés","Exercices de force conservés"],micro:["Séance remplacée par une microdose de 20 min : sauts, lancers, gainage"],upper:["Séance remplacée par haut du corps + mobilité + prévention légère"],active:["Séance remplacée par 30-40 min de vélo ou natation à 50-60 % FC max + mobilité"],targeted:[...targets].filter(t=>t!=="sprint").map(t=>"1 série de moins sur : "+ZONE_LABEL[t]).concat(targets.has("sprint")?["Sprints supplémentaires supprimés"]:[]).concat(targets.has("plyo")?["Sauts supprimés"]:[])};

const painHits=(e,zone)=>{const m=PAIN_MATCH[zone]||PAIN_MATCH.autre;if(e.check)return false;return m.re.test(e.n||"")||(m.z||[]).some(z=>(e.z||[]).includes(z))||((zone==="genou"||zone==="mollet"||zone==="cheville"||zone==="hanche")&&(e.plyo||e.sprint))};
/* Signalement le plus récent (3 jours avant la séance au plus) */
function painFor(date){const L=Object.entries(S.pain||{}).map(([id,p])=>({id,...p})).filter(p=>p.date&&diff(p.date,date)>=0&&diff(p.date,date)<=3&&p.decision!=="resolu");
  return L.sort((a,b)=>a.at<b.at?1:-1)[0]||null}
const painSerious=p=>p&&((+p.intensity>=7)||p.atRest===true||(p.onset==="habituelle"&&+p.intensity>=5)||p.zone==="autre");
const PAIN_ADVICE="L'appli ne pose aucun diagnostic. Si la douleur est inhabituelle, importante ou persiste, arrête les exercices concernés et demande l'avis d'un professionnel de santé.";
function painPlan(s,base){
  const p=painFor(s.date);const r={...base,pain:true,level:2,notes:[...(base.notes||[])]};
  if(!p){return{...r,mode:"painAsk",label:"Précise ta douleur",changes:["Indique où tu as mal pour que la proposition évite cette zone."],
    why:["Une douleur est signalée, mais sa zone n'est pas connue : aucune séance de remplacement n'est proposée à l'aveugle (une douleur à l'épaule ou au dos peut rendre une séance « haut du corps » inadaptée).",PAIN_ADVICE],
    effect:"Choisir une adaptation qui ne sollicite pas la zone douloureuse.",ask:true}}

  r.trig=[...(r.trig||[]),`Douleur signalée le ${fmtShort(p.date)} : ${zl}, ${isNum(p.intensity)?p.intensity+"/10":"intensité non précisée"}, ${p.onset==="habituelle"?"habituelle":p.onset==="recente"?"apparition récente":"apparition non précisée"}${p.atRest?", présente au repos":""}${p.trigger?", déclenchée par : "+p.trigger:""}`];
  if(painSerious(p))return{...r,mode:"rest",label:"Repos et avis d'un professionnel",painRef:p.id,painZone:p.zone,changes:["Séance non réalisée aujourd'hui","Mobilité très légère seulement si elle ne réveille aucune douleur"],
    why:[(+p.intensity>=7?"Douleur importante ("+p.intensity+"/10). ":"")+(p.atRest?"Douleur présente au repos. ":"")+(p.onset==="habituelle"?"Douleur qui revient. ":"")+(p.zone==="autre"?"Zone non reconnue par l'appli. ":"")+"Par prudence, l'appli ne propose pas d'exercice de remplacement.",PAIN_ADVICE],
    effect:"Ne pas charger une zone douloureuse et laisser un professionnel de santé évaluer la situation."};
  const items=tpl(s).fn(s);const hit=items.filter(e=>painHits(e,p.zone));

    why:["Les exercices prévus ne semblent pas solliciter : "+zl+". Arrête tout exercice qui réveille la douleur.",PAIN_ADVICE],effect:"Séance conservée, vigilance sur les sensations.",painRef:p.id};
  if(hit.length>items.filter(e=>!e.check).length/2)return{...r,mode:"active",label:ADAPT_LABEL.active,painRef:p.id,painZone:p.zone,

    why:[hit.length+" exercice(s) sur "+items.length+" sollicitent "+zl+".",PAIN_ADVICE],effect:"Garder une activité légère sans charger la zone."};

    why:["Ces exercices sollicitent la zone douloureuse ("+zl+"). Correspondance établie par l'appli, à valider par ton coach.",PAIN_ADVICE],

/* ---------- Application des règles du coach ---------- */
function enforceRules(s,r){
  const R=rulesFor(s);const out={...r,rule:{asked:r.mode,used:r.mode,refused:[],auto:true}};
  if(r.mode==="none"||r.mode==="painAsk"||r.mode==="rest")return out;
  if(!can("auto_adapt")){return{...out,mode:"coach",label:"Parles-en à ton coach",level:Math.max(1,r.level),changes:["Ta formule ne comprend pas les adaptations automatiques : ton coach décide des changements."],
    why:[...r.why],effect:"Ton coach adapte la séance s'il le juge utile.",rule:{...out.rule,used:"coach",entitlement:"auto_adapt"}}}
  if(ruleOk(s,r.mode))return out;
  out.rule.refused.push(r.mode);
  for(const m of FALLBACK[r.mode]||[]){if(ruleOk(s,m)){
    const base=recoChanges(m,r);return{...out,mode:m,label:ADAPT_LABEL[m],changes:base,level:Math.max(r.level,m==="active"||m==="micro"?2:1),
      why:[...r.why,"« "+RULE_LBL(r.mode)+" » n'est pas autorisée par ton coach pour ce programme : l'appli propose une option autorisée plus prudente."],rule:{...out.rule,used:m}}}
    out.rule.refused.push(m)}
  return{...out,mode:"coach",label:"Contacte ton coach",level:Math.max(1,r.level),changes:["Aucune adaptation automatique autorisée ne convient : la séance n'est pas modifiée sans l'accord de ton coach."],
    why:[...r.why,"Adaptations non autorisées par ton coach : "+out.rule.refused.map(RULE_LBL).join(", ")+"."],effect:"Ton coach décide de l'adaptation.",rule:{...out.rule,used:"coach"}};
}

/* =====================================================================
   PLAFOND PERSONNEL (remplace les marges fixes de départ)
   - Charge habituelle (chronique) = moyenne hebdomadaire des 28 jours qui précèdent la semaine analysée (cours Planification : ACWR ;
     version découplée pour que la semaine en cours ne se compte pas elle-même).
     Avant d'avoir 28 jours dans l'appli, les jours manquants sont complétés par la charge prévue du programme.
   - Charge aiguë = 7 derniers jours (réel quand c'est renseigné, sinon prévu) avec l'activité ajoutée.
   - Zones du cours Planification : ACWR 0,8-1,2 = progression saine ; > 1,5 = risque de blessure augmenté.
     ≤ 1,2 : rien ne change · 1,2 à 1,5 : recommandation · > 1,5 : alerte + adaptation proposée.
   - Foster (1998) : monotonie = moyenne / écart-type des charges quotidiennes sur 7 jours (repos compris),
     contrainte = charge de la semaine × monotonie ; seuils d'alerte du cours : monotonie > 2, contrainte > 6000.
   - L'ACWR est un repère et non une preuve de cause à effet (Impellizzeri 2020) : jamais de modification automatique.
   ===================================================================== */
function dayExpected(date){
  let v=0;
  activeClub().filter(e=>e.date===date).forEach(e=>{const r=srpe(e.actual);v+=r!=null?r:(+e.dur||0)*(+e.plannedRPE||0)});
  sessions().filter(s=>s.date===date&&!isOpt(s)).forEach(s=>{const st=statusOf(s);if(st==="missed"||st==="fatigue")return;const r=srpe(S.log[s.id]);v+=(st==="done"||st==="adapted")&&r!=null?r:plannedLoadOfSession(s)});
  otherOn(date).forEach(o=>v+=srpe(o));
  return Math.round(v);
}
/* Avant les données de l'appli (jours avant le 12/10) : charge estimée = charge PRÉVUE moyenne des 4 premières semaines du programme
   (pas de questionnaire supplémentaire). Dès que l'appli a 4 semaines de données, seules tes séances comptent. */
function baseWeekly(){return memo("baseW",()=>{let t=0;for(let i=0;i<28;i++)t+=dayLoad(addDays(PERIOD_START,i)).planned;return Math.round(t/4)})}
function loadDay(d){return d<PERIOD_START?null:dayExpected(d)}
function chronicInfo(date){
  const bw=baseWeekly();let sum=0,real=0,est=0;
  // 28 jours AVANT la semaine analysée (ratio « découplé ») : l'activité du jour ne compte pas à la fois dans la semaine et dans l'habituel.
  for(let i=7;i<35;i++){const d=addDays(date,-i);const v=loadDay(d);if(v==null){if(bw!=null){sum+=bw/7;est++}}else{sum+=v;real++}}
  if(real+est<7)return{weekly:null,real,est,src:"aucune"};
  const weekly=sum/(real+est)*7;
  return{weekly:Math.round(weekly),real,est,src:est===0?"tes 4 semaines précédentes":real===0?"la charge prévue de ton programme":"tes "+real+" jours dans l'appli + la charge prévue de ton programme pour les "+est+" autres"};
}
function acuteInfo(date){
  const bw=baseWeekly();const days=[];
  for(let i=6;i>=0;i--){const d=addDays(date,-i);const v=loadDay(d);days.push(v==null?(bw!=null?bw/7:0):v)}
  const total=days.reduce((a,b)=>a+b,0),m=total/7,sd=Math.sqrt(days.reduce((a,b)=>a+(b-m)*(b-m),0)/7);
  const mono=sd>0?m/sd:null;return{total:Math.round(total),mono,strain:mono!=null?Math.round(total*mono):null};
}
function otherVerdict(date){
  const st=S.settings,c=matchCtx(date),ch=chronicInfo(date),ac=acuteInfo(date),acts=otherOn(date),expected=dayExpected(date);
  const zone=+st.otZone||1.2,alert=+st.otAlert||1.5;
  const ratio=ch.weekly?ac.total/ch.weekly:null;
  let tier=ratio==null?0:ratio<=zone?0:ratio<=alert?1:2;const extra=[];
  if((c.dn===0||c.dn===1)&&acts.length&&tier<1){tier=1;extra.push(c.dn===0?"jour de match":"veille de match")}
  if(ac.mono!=null&&ac.mono>(+st.monoMax||2)&&ac.strain>(+st.strainMax||6000)&&tier<1){tier=1;extra.push("monotonie et contrainte élevées")}
  const limit=ch.weekly?Math.round(ch.weekly*zone):null,room=limit!=null?limit-ac.total:null;
  return{date,ctx:c,acts,expected,ratio,tier,chronic:ch,acute:ac,limit,room,extra,noBase:!ch.weekly};
}
const OT_TIER=["Dans la zone","Un peu au-dessus","Nettement au-dessus"];
/* Prochaine séance de muscu concernée : même jour (si pas encore faite) ou dans les 2 jours suivants. */
function dayCommentSignals(date){const out={legs:false,calf:false,post:false,upper:false,tired:false,pain:false,list:[]};
  const add=sg=>{["legs","calf","post","upper","tired","pain"].forEach(k=>{if(sg[k])out[k]=true});sg.list.forEach(l=>{if(!out.list.includes(l))out.list.push(l)})};
  otherOn(date).forEach(o=>add(commentSignals(o.comment)));
  return out;
}
/* Une proposition est faite si la journée dépasse nettement le plafond, OU si ton commentaire signale une zone fatiguée / une douleur,
   OU si tu signales une fatigue générale alors que la journée est déjà un peu au-dessus. */
function otherNeedsProposal(v,sg){return v.tier===2||sg.legs||sg.calf||sg.post||sg.upper||sg.pain||(sg.tired&&v.tier>=1)}
function nextSessionAfter(date){return sessions().find(s=>s.date>=date&&diff(date,s.date)<=2&&!isOpt(s)&&!statusOf(s))||null}
function otherAdvice(v){
  const legs=v.acts.some(o=>sportOf(o).legs>=1),up=v.acts.some(o=>sportOf(o).upper>=1);const sg=dayCommentSignals(v.date);
  if(sg.pain)return "Ton commentaire signale une douleur. L'appli ne pose aucun diagnostic : une adaptation de ta prochaine séance est proposée pour ne pas charger la zone. Si la douleur persiste, demande l'avis d'un professionnel de santé.";
  if(otherNeedsProposal(v,sg)&&v.tier<2)return "Ta charge reste "+(v.tier===0?"dans ta zone":"un peu au-dessus")+", mais ton commentaire signale : "+sg.list.join(", ")+". Une adaptation de ta prochaine séance est proposée : elle ne s'applique qu'avec ton accord.";
  if(v.noBase)return "Pas encore assez de données pour calculer ta charge habituelle.";
  if(v.tier===0)return "Ta semaine reste dans ta zone habituelle : rien ne change.";
  if(v.tier===1&&v.extra.length&&v.ratio!=null&&v.ratio<=(+S.settings.otZone||1.2))return "Ta charge de la semaine reste dans ta zone, mais attention : "+v.extra.join(", ")+". Recommandation : garde cette activité légère et récupère bien. Ta prochaine séance reste telle quelle.";
  if(v.tier===1)return "Ta semaine passe un peu au-dessus de ta charge habituelle. Recommandation : récupère bien ce soir (sommeil, hydratation, repas complet) et remplis le questionnaire demain matin. Ta prochaine séance reste telle quelle"+(legs?" ; si tes jambes sont lourdes, utilise « Alléger ».":".");
  return "Ta semaine dépasse nettement ta charge habituelle"+(legs?" et sollicite les jambes":up?" et sollicite surtout le haut du corps":"")+". Une adaptation de ta prochaine séance est proposée : elle ne s'applique qu'avec ton accord.";
}

/* Lecture du commentaire : mots-clés simples (pas d'IA). Sert uniquement à PROPOSER une adaptation, jamais à l'appliquer. */
const noAcc=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
function commentSignals(txt){
  const t=noAcc(txt);if(!t.trim())return{any:false,list:[]};
  const neg=/pas (de |les |des )?(jambes? )?(lourd|fatigu|courbatur|douleur|mal)/.test(t)||/aucune? (douleur|courbature|fatigue)/.test(t);
  const sig={
   legs:/jambes?.{0,25}(lourd|fatigu|cuit|mort|dur|coton|plomb|vid)|(lourd|fatigu).{0,15}jambes?|cuisses?|quadri|courbatur.{0,25}(jambe|cuisse)/.test(t),
   calf:/mollet|achille/.test(t),
   post:/ischio|arriere (de la |des )?cuisse/.test(t),
   upper:/epaule|bras|dos|pecto|coude|poignet|trapeze/.test(t)&&/(lourd|fatigu|courbatur|douleur|mal|tir|cuit|dur)/.test(t),
   tired:/fatigu|creve|epuise|cuit|crame|vidé|vide|a fond|tres dur|intense|lessive/.test(t),
   pain:/douleur|douloureu|bless|\bmal (a|au|aux|a la)\b|j.ai mal/.test(t)&&!/pas mal/.test(t)
  };
  if(neg&&!/mais/.test(t)){sig.legs=false;sig.tired=false;sig.pain=false}
  const L={legs:"jambes lourdes ou fatiguées",calf:"mollets / tendon d'Achille",post:"ischios",upper:"haut du corps",tired:"fatigue générale",pain:"douleur"};
  const list=Object.keys(L).filter(k=>sig[k]).map(k=>L[k]);
  return{...sig,any:list.length>0,list};
}

/* =====================================================================
   MODULE 10 · ANALYSE D'UN DÉPLACEMENT
   Messages : « Aucun impact important détecté » · « Vigilance accrue » / « Récupération probablement réduite » · « Enchaînement déconseillé ».
   Un risque n'est jamais présenté comme une certitude.
   ===================================================================== */
const VERDICT=["Aucun impact important détecté","Vigilance accrue","Enchaînement déconseillé"];
function zonesOf(s){const z=new Set();sessionItems(s).forEach(e=>{if(e.removed)return;(e.z||[]).forEach(k=>z.add(k));if(e.plyo)z.add("plyo");if(e.sprint)z.add("sprint")});return z}
function slotOk(date,T){
  const w=weekOf(date);if(!w)return{ok:false,msg:"Cette date est en dehors du programme."};
  const wd=D(date).getDay();
  if(w.type==="treve")return{ok:true};
  if(w.type==="alt"){
    if(wd===5)return T.fam==="light"?{ok:true}:{ok:false,msg:"Le vendredi matin doit rester libre ou très léger : partie vitesse avec le club le soir."};
    if(wd===1||wd===4)return{ok:true};
    return{ok:false,msg:"Ce jour n'est pas dans tes créneaux d'alternance (lundi toute la journée, jeudi matin, vendredi matin)."};
  }
  if(wd===1||wd===2||wd===4)return{ok:true};
  return{ok:false,msg:"Ce jour n'est pas dans tes créneaux de semaine de cours (lundi, mardi ou jeudi soir)."};
}
function analyze(id,newDate,swapId){
  const plan=sessions().map(s=>({...s}));
  const me=plan.find(s=>s.id===id);const other=swapId?plan.find(s=>s.id===swapId):null;
  const from=me.date;me.date=newDate;if(other)other.date=from;
  const msgs=[];let worst=0;const add=(l,t)=>{msgs.push({l,t});worst=Math.max(worst,l)};
  const ms=matchList(),club=activeClub();
  const check=s=>{
    const T=tpl(s),d=s.date,nm=T.name.toLowerCase(),heavy=T.fam==="heavy",z=zonesOf(s),power=T.fam==="power"||z.has("plyo")||z.has("sprint");
    if(d<PERIOD_START||d>PERIOD_END){add(2,"Cette date est en dehors du programme.");return}
    if(!isOpt(s)&&plan.some(x=>x.id!==s.id&&x.date===d&&!isOpt(x)))add(2,"Deux séances de musculation le même jour ("+fmtShort(d)+").");
    const c=ctxFrom(ms,d);
    if(c.dn===0)add(heavy||power?2:1,"La séance « "+nm+" » tombe le jour d'un match.");
    if(heavy){
      if(c.dn===1)add(2,"Séance lourde pour les jambes la veille du match (J-1) : moins de 48 heures de récupération avant le match.");
      else if(c.dn===2)add(1,"Séance lourde pour les jambes à J-2 : à la limite des 48 heures avant le match.");
      if(c.dp===1)add(2,"Lendemain de match (J+1) : jour de récupération, pas de séance lourde pour les jambes.");
      else if(c.dp===2)add(1,"J+2 : vérifie ton bien-être et la charge du match avant une séance lourde.");
    }else if(power){
      if(c.dn===1)add(2,"Sauts ou sprints la veille du match : garde plutôt une activation courte.");
      if(c.dp===1)add(1,"Sauts ou sprints le lendemain du match.");
    }
    club.filter(e=>e.kind==="training").forEach(e=>{
      const g=diff(d,e.date);
      if(g===0&&(heavy||power))add(e.speed&&power?2:1,"Même jour qu'une séance club ("+String(e.time).replace(":","h")+")"+(e.speed?" avec partie vitesse":"")+" : fais-la le plus loin possible de l'entraînement.");
      if(g===1&&e.speed&&power)add(1,"Partie vitesse au club le lendemain ("+fmtShort(e.date)+") : évite d'ajouter une deuxième grosse séance de vitesse.");
      if(g===-1&&(heavy||power)){
        const a=e.actual;if(!a)return;const fl=a.flags||[];
        if(fl.includes("sprints")&&z.has("post"))add(1,"La séance club de la veille a compté beaucoup de sprints : ischios et chaîne postérieure déjà sollicités.");
        if(fl.includes("accel")&&(z.has("post")||z.has("calf")))add(1,"Beaucoup d'accélérations la veille : fessiers, ischios et mollets déjà sollicités.");
        if(fl.includes("cod")&&z.has("quad"))add(1,"Beaucoup de freinages la veille : quadriceps déjà sollicités en excentrique.");
        if((fl.includes("duels")||fl.includes("sauts"))&&z.has("plyo"))add(1,"Beaucoup de duels ou de sauts la veille : limite les sauts supplémentaires.");
        if(fl.includes("lourdes"))add(1,"Jambes lourdes signalées la veille.");
        if(fl.includes("douleur"))add(1,"Douleur inhabituelle signalée la veille : demande l'avis d'un professionnel si elle persiste.");
        const cl=classifyLoad(e);if(cl&&cl.high){const hr=classifyHR(a);add(1,"Séance club de la veille chargée ("+cl.text+(hr.level?" · "+hr.text:"")+").")}
      }
    });
    plan.filter(x=>x.id!==s.id&&!isOpt(x)).forEach(x=>{
      const X=tpl(x),g=Math.abs(diff(x.date,d)),xh=X.fam==="heavy",xp=X.fam==="power";
      if(heavy&&xh&&g<=1)add(2,"Récupération insuffisante entre deux séances lourdes (« "+X.name.toLowerCase()+" » le "+fmtShort(x.date)+") : il faut au moins 48 heures.");
      else if(((heavy&&xp)||(power&&xh))&&g===0)add(2,"Séance lourde et séance de vitesse le même jour.");
      else if(((heavy&&xp)||(power&&xh))&&g===1)add(1,"Séance de vitesse à 24 heures d'une séance lourde (le "+fmtShort(x.date)+").");
    });
    if(!isOpt(s)){const so=slotOk(d,T);if(!so.ok)add(so.msg.startsWith("Le vendredi")&&heavy?2:1,so.msg)}
    const fe=fatigueEval(d);if(fe&&fe.high&&!isOpt(s))add(1,"Ton bien-être de ce jour indique une fatigue élevée.");
    const r=acwr(d,"real");if(r.ratio!=null&&r.ratio>1.5)add(1,"Indicateur de tendance : charge réelle des 7 derniers jours nettement au-dessus de ta moyenne des 4 semaines (ratio "+fmt(r.ratio,2)+", seuil de 1,5 cité dans le cours). Ce n'est pas une prédiction de blessure.");
  };
  check(me);if(other)check(other);
  const seen=new Set();const uniq=msgs.filter(m=>seen.has(m.t)?false:(seen.add(m.t),true)).sort((a,b)=>b.l-a.l);
  const recov=worst===1&&uniq.some(m=>/récupération|48 ?h|lendemain|veille/i.test(typeof m==="string"?m:(m.t||m.txt||"")));
  return{worst,msgs:uniq,title:recov?"Récupération probablement réduite":VERDICT[worst]};
}
function suggestDate(id){
  const s=sessionById(id);const t=todayISO();const c=[];
  for(let i=-6;i<=8;i++){const d=addDays(s.origDate,i);if(d===s.date||d<t||d<PERIOD_START||d>PERIOD_END)continue;
    if(sessions().some(x=>x.id!==id&&x.date===d&&!isOpt(x)))continue;
    const a=analyze(id,d);if(a.worst<2)c.push({d,score:a.worst*20+a.msgs.length*3+Math.abs(i)})}
  c.sort((a,b)=>a.score-b.score);return c[0]?c[0].d:null;
}

/* =====================================================================
   MODULE 11 · CEINTURE POLAR — interface PolarAdapter
   Méthodes communes : isAvailable · scan · connect · disconnect · getState · getCapabilities
   · startSession · pauseSession · resumeSession · stopSession · fetchOfflineRecordings
   Événements : state · device · hr {hr, rrs} · battery · capabilities · session
   ===================================================================== */
class PolarAdapter{
  constructor(kind,label){this.kind=kind;this.label=label;this.handlers={};this.state="disconnected";this.device=null;this.caps={hr:false,rr:false,battery:false,offlineRecording:false};this.battery=null;this.rec=null;this.lastHr=null;this.lastAt=null}
  on(ev,fn){(this.handlers[ev]=this.handlers[ev]||[]).push(fn)}
  emit(ev,d){(this.handlers[ev]||[]).forEach(f=>{try{f(d)}catch(e){console.warn(e)}})}
  setState(s,detail){this.state=s;this.emit("state",{state:s,detail})}
  isAvailable(){return false}
  getState(){return this.state}
  getCapabilities(){return{...this.caps}}
  async scan(){throw new Error("Recherche indisponible avec cet adaptateur.")}
  async connect(){throw new Error("Connexion indisponible avec cet adaptateur.")}
  async disconnect(){}
  async fetchOfflineRecordings(){return []}
  /* Séance : commune à tous les adaptateurs, alimentée par les événements "hr" */
  async startSession(opts={}){this.rec={start:nowMs(),pausedMs:0,pauseAt:null,samples:[],rr:0,mode:opts.mode||"live"};this.emit("session",{state:"running"})}
  pauseSession(){if(this.rec&&!this.rec.pauseAt){this.rec.pauseAt=nowMs();this.emit("session",{state:"paused"})}}
  resumeSession(){if(this.rec&&this.rec.pauseAt){this.rec.pausedMs+=nowMs()-this.rec.pauseAt;this.rec.pauseAt=null;this.emit("session",{state:"running"})}}
  async stopSession(){if(!this.rec)return null;if(this.rec.pauseAt)this.resumeSession();const r=this.rec;this.rec=null;

/* Résumé d'un enregistrement : durée, moyenne, max, temps par zone, courbe réduite */
function summarizeHR(samples,o){
  const hm=+S.settings.hrMax;const valid=samples.filter(s=>s[1]>30&&s[1]<240);
  const avg=valid.length?Math.round(valid.reduce((a,s)=>a+s[1],0)/valid.length):null;
  const max=valid.length?Math.max(...valid.map(s=>s[1])):null;
  const zones=hm?[0,0,0,0,0]:null;
  if(zones)valid.forEach((s,i)=>{const z=zoneOf(s[1],hm);const dt=i<valid.length-1?Math.min(10,valid[i+1][0]-s[0]):1;if(z>=0)zones[z]+=dt});
  const step=Math.max(1,Math.ceil(valid.length/300));const curve=valid.filter((_,i)=>i%step===0);
  const durMin=Math.round(((o.end-o.start-(o.pausedMs||0))/60000)*10)/10;
  return{id:uid("hr"),start:o.start,end:o.end,durMin,avg,max,zones,curve,source:o.source,device:o.device||null,rrCount:o.rr||0,linked:null};
}

/* =====================================================================
   MODULE 13 · RAPPEL RPE (≈ 30 min après la séance, recommandé par le cours)
   Version iPhone : notification locale native (Capacitor LocalNotifications).
   Version web : rappel visible dans « À renseigner » au prochain lancement. Aucun minuteur n'est présenté comme une notification garantie.
   ===================================================================== */
const Notify={
  native(){const C=window.Capacitor;return !!(C&&C.Plugins&&C.Plugins.LocalNotifications)},
  /* Rappels quotidiens du questionnaire (appli iOS uniquement). À VÉRIFIER sur l'appli native : format schedule.on de @capacitor/local-notifications. */
  async scheduleDaily(r){
    if(!this.native())return false;
    try{const LN=window.Capacitor.Plugins.LocalNotifications;const ids=[];for(let i=0;i<21;i++)ids.push({id:900000+i});await LN.cancel({notifications:ids});
      if(!r.on)return true;const p=await LN.checkPermissions();if(p.display!=="granted"){const q=await LN.requestPermissions();if(q.display!=="granted")return false}
      const list=[];let i=0;r.times.forEach(t=>{const [h,m]=t.split(":").map(Number);r.days.forEach(d=>{list.push({id:900000+(i++),title:"Questionnaire bien-être",body:"Remplis ton ressenti du jour (1 min).",schedule:{on:{weekday:d+1,hour:h,minute:m},allowWhileIdle:true}})})});
      await LN.schedule({notifications:list});return true}catch(e){return false}
  },
  async scheduleRpe(key,dueMs,label){
    if(!this.native()||dueMs<nowMs())return false;
    try{const LN=window.Capacitor.Plugins.LocalNotifications;const p=await LN.checkPermissions();if(p.display!=="granted"){const q=await LN.requestPermissions();if(q.display!=="granted")return false}
      const id=Math.abs([...key].reduce((h,c)=>((h<<5)-h+c.charCodeAt(0))|0,7))%2000000000;
      await LN.schedule({notifications:[{id,title:"RPE à noter",body:"Note l'effort perçu de ta séance « "+label+" » (0 à 10).",schedule:{at:new Date(dueMs)}}]});return true}catch(e){return false}
  }
};

/* Bande des 7 jours de la semaine, centrée automatiquement sur aujourd'hui */

/* Éléments à compléter (affichés dans Suivi) */
function todoItems(t){
  const out=[],now=nowMs();
  if(!wbFilled(t))out.push({date:"9999",html:`<button class="list-item" data-act="openWellness"><span class="sbar" style="background:var(--accent)"></span><div class="grow"><b>Questionnaire du jour</b><div class="small muted">Sommeil, fraîcheur, courbatures, stress, humeur · 1 min</div></div><span class="chip st-todo">${ICONS.question}À remplir</span></button>`});

    if((st==="done"||st==="adapted")&&!isNum(l.rpe)){const due=l.rpeDue;out.push({date:s.date,html:`<button class="list-item" data-rpe="${s.id}"><span class="sbar"></span><div class="grow"><b>RPE · ${esc(tpl(s).name)}</b><div class="small muted">${due&&due>now?"Recommandé vers "+hhmm(due)+" (30 min après) · possible dès maintenant":"Note l'effort perçu de 0 à 10"}</div></div><span class="chip st-todo">RPE</span></button>`})}
  });
  clubEvents().forEach(e=>{if(e.cancelled||e.date<PERIOD_START||e.date>t)return;const end=clubEnd(e);
    if(!e.actual&&end<=now)out.push({date:e.date,html:`<button class="list-item s-foot" data-club="${e.id}"><span class="sbar"></span><div class="grow"><b>${e.kind==="match"?"Match":"Séance club"} · ${fmtShort(e.date)}</b><div class="small muted">Durée, RPE, FC et ressenti</div></div><span class="chip st-todo">À renseigner</span></button>`});

  });
  return out.sort((a,b)=>a.date<b.date?1:-1);
}

/* ---------- CALENDRIER ---------- */
const TYPE_ABBR={muscu:"M",club:"C",match:"Mt",other:"A",rest:"R"};
function viewCal(){
  const t=todayISO();
  const cb=calBounds();if(!calMonth||calMonth<cb.min||calMonth>cb.max)calMonth=t.slice(0,7);
  const [y,mo]=calMonth.split("-").map(Number);const first=new Date(y,mo-1,1,12);const startOff=(first.getDay()+6)%7;const gridStart=addDays(iso(first),-startOff);
  const all=sessions();

  if(reorg)h+=`<div class="reorg-bar" role="status"><span>Glisse la séance sur un autre jour. Les jours en bleu sont compatibles.</span><button type="button" data-act="endReorg">Annuler</button></div>`;
  h+=`<div class="cal-nav-row"><button class="icon-btn" data-act="prevM" aria-label="Mois précédent" ${calMonth<=cb.min?"disabled":""}>${ICONS.back}</button>
   <button class="btn ghost small" data-act="todayM">Aujourd'hui</button>
   <button class="icon-btn" data-act="nextM" aria-label="Mois suivant" ${calMonth>=cb.max?"disabled":""}>${ICONS.chevron}</button></div>`;
  h+=`<div class="cal" id="cal" role="grid" aria-label="Calendrier de ${MOIS[mo-1]} ${y}">`+["L","M","M","J","V","S","D"].map(x=>`<div class="dow" aria-hidden="true">${x}</div>`).join("");
  for(let i=0;i<42;i++){const d=addDays(gridStart,i);const inM=d.slice(0,7)===calMonth;if(i>=35&&!inM&&D(d).getDay()===1)break;
    const ss=all.filter(s=>s.date===d),ft=clubOn(d),ot=otherOn(d);
    const lab=cap(fmtLong(d))+(ss.length?", "+ss.map(s=>"musculation "+tpl(s).name+" ("+STATUS_LABEL[displayStatus(s)]+")").join(", "):"")+(ft.length?", "+ft.map(e=>(e.kind==="match"?"match":"entraînement club")+(e.cancelled?" annulé":e.actual?" renseigné":"")).join(", "):"")+(ot.length?", "+ot.map(o=>"autre activité "+sportOf(o).name).join(", "):"");
    if(i%7===0)h+=(i?`</div>`:"")+`<div class="cal-row" role="row">`;
    h+=`<div class="cell ${inM?"":"out"} ${d===t?"is-today":""} ${d===selDay?"sel":""}" data-date="${d}" role="gridcell" tabindex="0" aria-label="${esc(lab)}"><span class="d num" aria-hidden="true">${D(d).getDate()}</span>`+
      ss.map(s=>{const st=displayStatus(s);return `<div class="ev sess st-${st} ${isOpt(s)?"optional":""}" data-sid="${s.id}" aria-hidden="true">${STATUS_SYM[st]?`<i>${STATUS_SYM[st]}</i>`:""}${esc(tpl(s).short)}</div>`}).join("")+
      ft.map(e=>`<div class="ev foot ${e.kind==="match"?"match":""} ${e.cancelled?"cancel":""}" aria-hidden="true">${e.kind==="match"?"Match":"Club"}</div>`).join("")+
      ot.map(o=>`<div class="ev other" aria-hidden="true">${esc(sportOf(o).name.slice(0,4))}</div>`).join("")+`</div>`}
  h+=`</div></div><div class="legend" aria-label="Légende"><span><i class="lg st-done"></i>✓ Réalisée</span><span><i class="lg st-adapted"></i>✎ Adaptée</span><span><i class="lg st-missed"></i>✕ Non réalisée</span><span><i class="lg st-todo"></i>? À renseigner</span><span><i class="lg st-future"></i>À venir</span><span><i class="lg lg-foot"></i>Club / match</span><span><i class="lg lg-other"></i>Autre activité</span></div>`;
  h+=`<p class="small muted">${reorg?"":"Touche un jour pour voir le détail. Pour déplacer une séance : garde le doigt 2 secondes dessus, puis glisse-la sans relever le doigt."}</p>`;
  const day=selDay||(t.slice(0,7)===calMonth?t:null);
  if(day){const ss=all.filter(s=>s.date===day),ft=clubOn(day),ot=otherOn(day),c=matchCtx(day);
    h+=`<section class="card" aria-labelledby="dayH"><div class="row between"><h3 id="dayH">${cap(fmtLong(day))}</h3><span class="chip st-future">${esc(c.label)}</span></div>`+

function trainSessions(){

  const past=sessions().filter(s=>s.date<=t&&statusOf(s)).sort((a,b)=>a.date<b.date?1:-1).slice(0,12);
  h+=`<section class="card" aria-labelledby="pastH"><h3 id="pastH">Dernières séances</h3>`+(past.length?past.map(s=>{const l=S.log[s.id]||{},d=D(s.date);

  return h;

/* Objectifs du bloc : programme historique (LUCAS.blockGoals) ou blocs du programme attribué */
function blockGoals(){if(legacyActive())return LUCAS.blockGoals;const a=assignmentOf(CUR_UID);if(!a)return[];
  return(a.prog.blocks||[]).map(b=>{const ws=WEEKS.filter(w=>w.block===b.name);return{from:ws.length?ws[0].s:PERIOD_START,to:ws.length?addDays(ws[ws.length-1].s,6):PERIOD_END,t:b.name+(ws.length?" ("+fmtShort(ws[0].s)+" → "+fmtShort(addDays(ws[ws.length-1].s,6))+")":""),items:[b.goal||(a.prog.goal)||"Objectif précisé par ton coach."]}})}
function trainPlan(){
  const t=todayISO();let h="";
  const BG=blockGoals();const bg=BG.find(b=>t>=b.from&&t<=b.to)||BG[0]||{t:"",items:[]};

const wbFilled=d=>!!(S.fatigue[d]&&isNum(S.fatigue[d].score));
const isDone=s=>{const st=statusOf(s);return st==="done"||st==="adapted"};
/* Meilleure série de questionnaires (jours consécutifs remplis) */
function qStats(){return memo("qStats",()=>{
  const t=todayISO();let best=0,cur=0,total=0;
  for(let d=PERIOD_START;d<=t;d=addDays(d,1)){if(wbFilled(d)){cur++;total++;best=Math.max(best,cur)}else if(d<t)cur=0}
  return{best,cur,total};
})}
function sStats(){return memo("sStats",()=>{
  const t=todayISO();let total=0,cur=0,best=0;
  sessions().filter(s=>s.date<=t&&!isOpt(s)).forEach(s=>{const st=statusOf(s);if(st==="done"||st==="adapted"){total++;cur++;best=Math.max(best,cur)}else if(st==="missed")cur=0});
  return{total,best};
})}
/* Semaine parfaite : toutes les séances prévues faites + au moins 6 questionnaires sur 7 (semaine terminée) */
function weekStatus(w){
  const end=w.type==="treve"?PERIOD_END:addDays(w.s,6),t=todayISO();
  const ss=sessions().filter(s=>s.date>=w.s&&s.date<=end&&!isOpt(s));const done=ss.filter(isDone).length;
  let q=0,days=0;for(let d=w.s;d<=end&&d<=t;d=addDays(d,1)){days++;if(wbFilled(d))q++}
  return{w,end,planned:ss.length,done,q,days,over:end<t,perfect:end<t&&ss.length>0&&done===ss.length&&q>=Math.min(6,days)};
}

/* ---------- Courbe : ressenti et charge sur 28 jours ---------- */
function curveSvg(end,days=28){
  const W=340,H=170,pl=30,pr=30,pt=12,pb=24,iw=W-pl-pr,ih=H-pt-pb;const pts=[];
  for(let i=days-1;i>=0;i--){const d=addDays(end,-i);if(d<PERIOD_START)continue;let ld=0;realEntries().filter(r=>r.date===d).forEach(r=>ld+=r.srpe);pts.push({d,ld,wb:wbFilled(d)?+S.fatigue[d].score:null})}
  if(!pts.length)return "";const n=pts.length,bw=iw/n,maxL=Math.max(400,...pts.map(p=>p.ld));
  const x=i=>pl+i*bw+bw/2,yL=v=>pt+ih-v/maxL*ih,yW=v=>pt+ih-v/100*ih;
  const bars=pts.map((p,i)=>p.ld?`<rect x="${(x(i)-bw*.35).toFixed(1)}" y="${yL(p.ld).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${(pt+ih-yL(p.ld)).toFixed(1)}" rx="2" class="cv-bar"/>`:"").join("");
  let path="",seg=false;pts.forEach((p,i)=>{if(p.wb==null){seg=false;return}path+=(seg?"L":"M")+x(i).toFixed(1)+" "+yW(p.wb).toFixed(1);seg=true});
  const dots=pts.map((p,i)=>p.wb!=null?`<circle cx="${x(i).toFixed(1)}" cy="${yW(p.wb).toFixed(1)}" r="2.6" class="cv-dot"/>`:"").join("");
  const ticks=pts.map((p,i)=>(i%7===0||i===n-1)?`<text x="${x(i).toFixed(1)}" y="${H-6}" class="cv-t" text-anchor="middle">${D(p.d).getDate()}/${D(p.d).getMonth()+1}</text>`:"").join("");
  return `<svg viewBox="0 0 ${W} ${H}" class="curve" role="img" aria-label="Charge quotidienne (barres) et ressenti (ligne) sur ${n} jours">
   <line x1="${pl}" y1="${pt+ih}" x2="${W-pr}" y2="${pt+ih}" class="cv-axis"/>
   <text x="${pl-4}" y="${pt+8}" class="cv-t" text-anchor="end">${maxL}</text><text x="${pl-4}" y="${pt+ih}" class="cv-t" text-anchor="end">0</text>
   <text x="${W-pr+4}" y="${pt+8}" class="cv-t cv-tw">100</text><text x="${W-pr+4}" y="${pt+ih}" class="cv-t cv-tw">0</text>
   ${bars}<path d="${path}" class="cv-line"/>${dots}${ticks}</svg>`;
}

function curveInsight(end){

}

/* ---------- Bilan de la semaine ---------- */
function weekReport(w){
  const ws=weekStatus(w),end=ws.end,t=todayISO();
  let real=0,foot=0,footN=0,oth=0;realEntries().filter(r=>r.date>=w.s&&r.date<=end).forEach(r=>{real+=r.srpe;if(r.kind==="training"||r.kind==="match"){foot+=r.srpe;footN++}if(r.kind==="autre")oth++});
  const wbs=[];for(let d=w.s;d<=end&&d<=t;d=addDays(d,1))if(wbFilled(d))wbs.push(+S.fatigue[d].score);
  const avg=wbs.length?Math.round(wbs.reduce((a,b)=>a+b,0)/wbs.length):null;
  const ton=weekTon(w),i=WEEKS.indexOf(w),pton=i>0?weekTon(WEEKS[i-1]):0;
  const ch=chronicInfo(addDays(end,1));const ratio=ch.weekly?real/ch.weekly:null;
  const newB=BADGES.filter(b=>S.awards[b.id]&&S.awards[b.id]>=w.s&&S.awards[b.id]<=end);
  const adapted=sessions().filter(s=>s.date>=w.s&&s.date<=end&&statusOf(s)==="adapted").length;
  const msg=ws.perfect?"Semaine parfaite : tu as tout fait. Profite de ta récompense.":ws.done===ws.planned&&ws.planned?"Toutes tes séances sont faites. Pense au ressenti chaque matin pour une semaine parfaite.":ws.done?"Chaque séance compte. Garde le rythme la semaine prochaine.":"Nouvelle semaine, nouveau départ : une séance à la fois.";
  return `<div class="stack tight">
   <div class="wr-grid">
    <div><small>Séances</small><b class="num">${ws.done}/${ws.planned}</b>${adapted?`<span class="tiny muted">dont ${adapted} adaptée${adapted>1?"s":""}</span>`:""}</div>
    <div><small>Ressentis</small><b class="num">${ws.q}/${ws.days}</b>${avg!=null?`<span class="tiny muted">moyenne ${avg}/100</span>`:""}</div>
    <div><small>Charge</small><b class="num">${Math.round(real)} UA</b>${ratio!=null?`<span class="tiny muted">${Math.round(ratio*100)} % de l'habituel</span>`:""}</div>
    <div><small>Volume muscu</small><b class="num">${ton.toLocaleString("fr-FR")} kg</b>${pton?`<span class="tiny muted">${ton>=pton?"+":""}${Math.round((ton/pton-1)*100)} % vs sem. préc.</span>`:""}</div>
   </div>
   <p class="small">${footN} séance${footN>1?"s":""} de foot renseignée${footN>1?"s":""} (${Math.round(foot)} UA)${oth?` · ${oth} autre${oth>1?"s":""} activité${oth>1?"s":""}`:""}${newB.length?` · badge${newB.length>1?"s":""} : ${newB.map(b=>b.n).join(", ")}`:""}.</p>
   <p class="small"><b>${esc(msg)}</b></p></div>`;
}

/* ---------- Aperçu en pastilles (accueil, sous le ressenti) ---------- */
function ringTile(o){
  const R=26,C=2*Math.PI*R,v=o.pct==null?0:Math.max(0,Math.min(100,o.pct));
  return `<button type="button" class="gl-tile" ${o.attr} aria-label="${esc(o.label)} : ${esc(o.aria)}">
   <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${R}" class="gl-bg" style="stroke:${o.soft}"/>${o.pct!=null?`<circle cx="32" cy="32" r="${R}" class="gl-fg" style="stroke:${o.color};stroke-dasharray:${(C*v/100).toFixed(1)} ${C.toFixed(1)}"/>`:""}</svg>
   <b class="num">${esc(o.value)}</b><span>${esc(o.label)}</span>${o.sub?`<small class="gl-sub">${esc(o.sub)}</small>`:""}</button>`;
}
function glanceTiles(t){
  const f=S.fatigue[t],sc=f&&isNum(f.score)?+f.score:null;
  // Régularité : questionnaires remplis sur les 7 derniers jours (dans le programme)
  let n=0,q=0;for(let i=0;i<7;i++){const d=addDays(t,-i);if(d<PERIOD_START)continue;n++;if(wbFilled(d))q++}
  const reg=n?Math.round(q/n*100):null;
  // Tendance : moyenne du ressenti sur 7 jours, comparée aux 7 jours d'avant
  const avg=(a,b)=>{const v=[];for(let i=a;i<b;i++){const d=addDays(t,-i);if(wbFilled(d))v.push(+S.fatigue[d].score)}return v.length?Math.round(v.reduce((x,y)=>x+y,0)/v.length):null};
  const m7=avg(0,7),m14=avg(7,14);const tr=m7!=null&&m14!=null?m7-m14:null;
  const col=v=>v==null?"var(--muted)":v>=75?"var(--done)":v>=60?"var(--accent)":v>=45?"var(--warn)":"var(--missed)";
  const nb=nextBadge(t);
  return `<section class="gl-row" aria-label="Ton ressenti en un coup d'œil">
   ${ringTile({label:"Ressenti",value:sc!=null?String(sc):"–",pct:sc,color:col(sc),soft:"var(--accent-soft)",attr:sc!=null?'data-goto="suivi:ressenti"':'data-act="openWellness"',aria:sc!=null?sc+" sur 100 aujourd'hui, "+wbLabel(sc):"pas encore rempli aujourd'hui"})}
   ${ringTile({label:"Régularité",value:reg!=null?reg+"%":"–",pct:reg,color:"var(--done)",soft:"var(--done-soft)",attr:'data-goto="suivi:progres"',aria:reg!=null?q+" questionnaires sur "+n+" jours":"pas encore de données"})}
   ${ringTile({label:"Moy. 7 j",value:m7!=null?String(m7)+(tr!=null&&tr!==0?(tr>0?" ↑":" ↓"):""):"–",pct:m7,color:col(m7),soft:"var(--missed-soft)",attr:'data-goto="suivi:progres"',aria:m7!=null?m7+" sur 100 en moyenne sur 7 jours"+(tr!=null?(tr>0?", en hausse de ":tr<0?", en baisse de ":", stable")+(tr?Math.abs(tr)+" points":""):""):"pas encore de données"})}
   ${ringTile({label:"Prochain badge",sub:nb?nb.b.n:"",value:nb?(nb.days<=0?"Auj.":nb.days===1?"Demain":nb.days+" j"):"✓",pct:nb?nb.pct:100,color:"#F5B82E",soft:"#FBEFD2",attr:'data-goto="suivi:badges"',aria:nb?"« "+nb.b.n+" » "+(nb.days<=0?"aujourd'hui":nb.days===1?"demain":"dans "+nb.days+" jours")+" si tu restes régulier, le "+fmtShort(nb.date):"tous les badges sont obtenus"})}
  </section>`;
}

/* Prochain badge : celui qui sera atteint le plus tôt si l'athlète reste régulier (ressenti chaque jour, séances prévues faites) */
function nextBadge(t){
  const up=sessions().filter(s=>s.date>=t&&!isOpt(s)&&!isDone(s)&&statusOf(s)!=="missed");
  const todayQ=wbFilled(t)?1:0;
  const byDays=rem=>addDays(t,Math.max(0,rem-1+todayQ));        // 1 questionnaire par jour, aujourd'hui compris s'il n'est pas rempli
  const bySess=rem=>up[rem-1]?up[rem-1].date:null;               // n-ième séance à venir
  const curStreak=(()=>{let n=0;sessions().filter(s=>s.date<=t&&!isOpt(s)).forEach(s=>{const st=statusOf(s);if(st==="done"||st==="adapted")n++;else if(st==="missed")n=0});return n})();
  const cand=[];
  BADGES.forEach(b=>{if(S.awards[b.id])return;const [c,tg]=b.p();let date=null;
    if(b.id.startsWith("qt"))date=byDays(tg-qStats().total);
    else if(b.g==="q")date=byDays(tg-qStats().cur);
    else if(b.id.startsWith("st"))date=bySess(tg-curStreak);
    else if(b.g==="s")date=bySess(tg-sStats().total);
    else if(b.g==="w"){const w=weekOf(t);if(w){const i=WEEKS.indexOf(w);const rem=tg-c;const wk=WEEKS[i+rem-1];if(wk){const ws=weekStatus(w);const possible=ws.done+up.filter(s=>s.date<=ws.end).length>=ws.planned;if(possible||rem>1)date=addDays(wk.type==="treve"?PERIOD_END:addDays(wk.s,6),1)}}}
    if(date&&date<=addDays(PERIOD_END,1))cand.push({b,date,days:diff(t,date),pct:Math.round(Math.min(c,tg)/tg*100)})});
  cand.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:b.pct-a.pct);
  return cand[0]||null;
}

/* Photo : réduite à 720 px (JPEG) pour rester légère ; vidéo : gardée en mémoire seulement dans la maquette */
function msgPickFile(f){
  if(!f)return;
  if(f.type.startsWith("video/")){if(f.size>50*1024*1024){toast("Vidéo trop lourde (50 Mo maximum)");return}MSG_MEDIA={type:"video",src:URL.createObjectURL(f),name:f.name,temp:true};render();toast("Vidéo temporaire : elle ne sera pas conservée après fermeture de l'appli (prototype)");return}
  if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type)){toast("Format non pris en charge (JPEG, PNG, WebP)");return}
  if(f.size>8*1024*1024){toast("Image trop lourde (8 Mo maximum)");return}
  if(storageUse().pct>85){toast("Stockage de l'appareil presque plein : supprime des médias avant d'en ajouter");return}
  const rd=new FileReader();rd.onload=()=>{const img=new Image();img.onload=()=>{const k=Math.min(1,720/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    MSG_MEDIA={type:"image",src:c.toDataURL("image/jpeg",.72),name:f.name};render()};img.onerror=()=>toast("Image illisible");img.src=rd.result};rd.readAsDataURL(f);
}

function tickPlayer(){

    if(el>=a.ph[a.phase].planned&&!a.alerted[a.phase]){a.alerted[a.phase]=true;save();const o=p.querySelector('[data-tick="over"]');if(o)o.hidden=false;Native.haptic("heavy");beep(2)}return}

/* Ordre imposé par le cahier des charges */
const OB_STEPS=[
 {k:"goals",q:"Quels sont tes objectifs ?",sub:"Choisis-en autant que tu veux, puis désigne ton objectif principal.",type:"goals",req:true},
 {k:"sports",q:"Quels sports pratiques-tu ?",sub:"Plusieurs choix possibles.",type:"multi",opts:OB_SPORTS,req:true,excl:"aucun"},
 {k:"levels",q:"Quel est ton niveau dans chaque sport ?",type:"levels",req:true,skipIf:a=>sportsSel(a).length===0},
 {k:"freq",q:"Combien d'entraînements par semaine pour chaque sport ?",type:"freq",req:true,skipIf:a=>sportsSel(a).length===0},
 {k:"sportDetail",q:"Ton calendrier sportif",sub:"Facultatif. Il sert à éviter les séances lourdes la veille et le lendemain des matchs.",type:"sportDetail",req:false,skipIf:a=>sportsSel(a).length===0},
 {k:"exp",q:"Quelle est ton expérience en musculation ?",type:"exp",req:true},
 {k:"sex",q:"Quel est ton sexe ?",sub:"Il fait partie de l'individualisation, avec tes tests, ton niveau, ton sport, tes contraintes et ta récupération.",type:"single",opts:[["femme","Femme"],["homme","Homme"]],req:true},
 {k:"dispo",q:"Quand peux-tu t'entraîner ?",sub:"Tes jours disponibles et la durée que tu préfères.",type:"dispo",req:true},
 {k:"equip",q:"Quel équipement as-tu ?",type:"equip",req:true},
 {k:"pain",q:"As-tu des douleurs, blessures ou restrictions ?",sub:"Ces informations restent entre toi et ton coach.",type:"pain",req:true},
 {k:"body",q:"Combien pèses-tu ?",type:"weight",req:true},
 {k:"devices",q:"Quels appareils ou applications utilises-tu ?",type:"devices",req:false},
 {k:"expect",q:"Qu'attends-tu de l'application ?",type:"multi",opts:OB_EXPECT,req:true},
 {k:"source",q:"Comment as-tu découvert l'application ?",sub:"Question facultative.",type:"single",opts:OB_SOURCES,req:false},
 {k:"recap",q:"Vérifie tes réponses",sub:"Tu peux corriger chaque réponse avant de créer ton compte.",type:"recap",req:false},
 {k:"account",q:"Crée ton compte",type:"account",req:true}
];
const sportsSel=a=>((a.sports||{}).v||[]).filter(x=>x!=="aucun");
const draft=()=>{if(!PL.onboardDraft)PL.onboardDraft={answers:{},step:0,startedAt:nowISO()};return PL.onboardDraft};
const ans=()=>draft().answers;
function obSave(){draft().updatedAt=nowISO();plSave()}
function obGo(i){const a=ans();let j=i;while(OB_STEPS[j]&&OB_STEPS[j].skipIf&&OB_STEPS[j].skipIf(a))j+=(j>=draft().step?1:-1);draft().step=Math.max(0,Math.min(OB_STEPS.length-1,j));AUTH.screen="q";obSave();render();window.scrollTo(0,0)}
function obNext(){const d=draft();if(d.returnToRecap){d.returnToRecap=false;obGo(OB_STEPS.findIndex(x=>x.k==="recap"));return}obGo(d.step+1)}
function obBack(){if(draft().step===0){AUTH.screen="intro";render();return}const a=ans();let j=draft().step-1;while(j>0&&OB_STEPS[j].skipIf&&OB_STEPS[j].skipIf(a))j--;draft().step=j;obSave();render()}
const optLabel=(list,k)=>(list.find(x=>x[0]===k)||[k,k])[1];
/* ---------- Vues ---------- */
function viewAuth(){
  const s=AUTH.screen;
  return `<div class="auth">${!Cloud.isCloud()?`<div class="demo-banner mode-banner" role="note"><b>Mode démonstration.</b> Les données restent sur cet appareil et aucun compte réel n'est créé.</div>`:""}${({checkMail:authCheckMail,forgot:authForgot,newPass:authNewPass,migrate:authMigrate,migReport:authMigReport,intro:authIntro,q:authQuestion,login:authLogin,coachLogin:authCoachLogin,code:authCode,codeVerify:authCodeVerify,notif:authNotif,widget:authWidget,widgetLater:authWidgetLater,faceid:authFaceId,processing:authProcessing,call:authCall,callWhy:authCallWhy,callBook:authCallBook,offers:authOffers,lock:authLock}[s]||authIntro)()}</div>`;
}
function afterAuthRender(){
  const f=document.querySelector(".auth [data-autofocus]")||document.querySelector(".auth h1");if(f){if(f.tagName==="H1")f.setAttribute("tabindex","-1");f.focus({preventScroll:true})}
  if(AUTH.screen==="q"&&OB_STEPS[draft().step].type==="weight")initWheels();
  if(AUTH.screen==="processing")runProcessing();
}
const obHead=(back=true)=>{const i=draft().step,n=OB_STEPS.length;return `<div class="ob-top">${back?`<button class="icon-btn" data-act="obBack" aria-label="Étape précédente">${ICONS.back}</button>`:"<span></span>"}<div class="ob-prog" role="progressbar" aria-valuemin="1" aria-valuemax="${n}" aria-valuenow="${i+1}" aria-label="Étape ${i+1} sur ${n}"><i style="width:${Math.round((i+1)/n*100)}%"></i></div><button class="linkish small" data-act="obLater">Reprendre plus tard</button></div>`};
/* Introduction : téléphone animé montrant de vrais écrans de l'appli */

   <h1 class="intro-t">Tu viens de faire le premier pas.</h1><p class="intro-p">Construisons la suite, séance après séance, jusqu'à tes objectifs.</p>
   <div class="stack tight intro-btns">${d&&d.step>0?`<button class="btn full big" data-act="obResume" data-autofocus>Reprendre mon inscription (étape ${d.step+1}/${OB_STEPS.length})</button>`:""}
    <button class="btn ${d&&d.step>0?"secondary":""} full big" data-act="obStart" ${d&&d.step>0?"":"data-autofocus"}>Commencer</button>
    <button class="btn secondary full" data-act="authLogin">J'ai déjà un compte</button>
    <button class="btn ghost full" data-act="authCode">J'ai un code coach</button></div>

   <div class="slide"><div class="m-h">Calendrier</div><div class="m-cal">${Array.from({length:28},(_,i)=>`<i class="${[1,4,8,11,15,18].includes(i)?"m":[2,9,16].includes(i)?"f":[6,13].includes(i)?"x":""}"></i>`).join("")}</div></div>
   <div class="slide"><div class="m-h">Séance</div><div class="m-work"><b>TRAVAIL</b><span>Série 2/4</span></div><div class="m-card"><b>Squat arrière</b><small>4 × 4 · 85 kg</small></div><div class="m-btn wide">Série terminée</div></div>
